<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Raqamni tasdiqlash — sotibber.uz</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Space Grotesk', 'Inter', 'sans-serif'] },
          colors: { violet: { brand: '#7c3aed', deep: '#4f46e5' }, ink: { 900: '#07060d', 800: '#0d0b18' } },
        },
      },
    };
  </script>

  <style>
    body {
      background:
        radial-gradient(820px 480px at 50% -10%, rgba(255,122,60,.12), transparent 60%),
        radial-gradient(700px 460px at 85% 6%, rgba(99,102,241,.14), transparent 58%),
        radial-gradient(680px 440px at 10% 100%, rgba(236,72,153,.10), transparent 55%),
        #040406;
      color: #e9e7ef;
      overflow-x: hidden;
    }
    .font-display { letter-spacing: -0.01em; }
    .orb {
      position: fixed; border-radius: 50%; filter: blur(48px); opacity: .8;
      pointer-events: none; z-index: 0; mix-blend-mode: screen;
      will-change: transform, border-radius;
    }
    .orb-warm { background: radial-gradient(60% 60% at 32% 30%, #ffb15a 0%, #ff6a2e 38%, rgba(255,61,74,.65) 62%, transparent 78%); animation: morph 16s ease-in-out infinite; }
    .orb-cool { background: radial-gradient(60% 60% at 60% 40%, #6ea8ff 0%, #4f6bff 40%, rgba(124,58,237,.6) 66%, transparent 80%); animation: morph 20s ease-in-out infinite reverse; }
    .orb-iris { background: radial-gradient(55% 55% at 40% 45%, #37e0c8 0%, #7c9cff 35%, #d95cff 62%, transparent 80%); animation: morph 24s ease-in-out infinite; }
    @keyframes morph {
      0%,100% { border-radius: 44% 56% 62% 38% / 46% 42% 58% 54%; transform: translate(0,0) rotate(0deg) scale(1); }
      33%     { border-radius: 62% 38% 44% 56% / 58% 60% 40% 42%; transform: translate(3%, -3%) rotate(28deg) scale(1.07); }
      66%     { border-radius: 38% 62% 56% 44% / 42% 46% 54% 58%; transform: translate(-3%, 3%) rotate(-22deg) scale(.95); }
    }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none !important; } }

    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .btn-tg {
      background: linear-gradient(135deg, #34a4e0 0%, #2b8fd6 100%);
      color: #fff;
      box-shadow: 0 14px 40px -12px rgba(45,143,214,0.65), inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .otp {
      width: 3.25rem; height: 3.75rem;
      text-align: center;
      font-size: 1.6rem; font-weight: 800;
      color: #f1f0f7;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.14);
      border-radius: 0.9rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s, transform .05s;
      font-variant-numeric: tabular-nums;
    }
    .otp:focus { border-color: rgba(255,138,80,0.75); box-shadow: 0 0 0 3px rgba(255,138,80,0.18); }
    .otp.filled { border-color: rgba(124,58,237,0.7); }
    @media (max-width: 380px) { .otp { width: 2.75rem; height: 3.25rem; font-size: 1.4rem; } }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body class="relative flex min-h-screen items-center justify-center overflow-hidden p-4 font-sans text-slate-200 antialiased">

  <div class="orb orb-warm right-[-60px] top-[-40px] h-[340px] w-[420px]"></div>
  <div class="orb orb-cool left-[-80px] top-[30%] h-[320px] w-[380px]"></div>
  <div class="orb orb-iris left-1/2 bottom-[-80px] h-[360px] w-[460px] -translate-x-1/2"></div>

  <div class="relative z-10 w-full max-w-md">
    <!-- Logo -->
    <div class="mb-6 flex items-center justify-center gap-2">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-violet-brand to-violet-deep text-white shadow-lg shadow-violet-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="font-display text-2xl font-bold tracking-tight text-white">sotibber<span class="text-violet-400">.uz</span></span>
    </div>

    <div class="glass rounded-3xl p-6 shadow-2xl sm:p-8">
      <div class="text-center">
        <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 text-white shadow-lg shadow-sky-500/30">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.29a1.5 1.5 0 0 0-1.6-.23L3.4 11.1c-1.2.5-1.14 2.24.09 2.66l4.2 1.42 1.62 5.1c.32 1 1.6 1.26 2.28.46l2.3-2.7 4.28 3.15c.77.57 1.88.16 2.1-.77l3.2-13.6a1.5 1.5 0 0 0-.53-1.19zM9.7 14.2l8.2-5.9-6.6 6.98a1 1 0 0 0-.27.55l-.36 2.3-.97-3.03z"/></svg>
        </span>
        <h1 class="mt-4 font-display text-2xl font-bold text-white">Kodni kiriting</h1>
        <p class="mt-2 text-sm leading-relaxed text-slate-400">
          <a id="botLink" href="#" target="_blank" rel="noopener" class="font-bold text-sky-400 hover:underline">@bot</a>
          telegram botiga kiring va <b class="text-slate-200">4 xonalik</b> kodingizni oling.
        </p>
      </div>

      <!-- Banner -->
      <div id="msg" class="mt-5 hidden rounded-xl px-4 py-3 text-sm font-medium"></div>

      <!-- Botni ochish tugmasi -->
      <a id="openBot" href="#" target="_blank" rel="noopener"
         class="btn-tg mt-6 flex w-full items-center justify-center gap-2 rounded-xl py-3 text-sm font-bold transition active:scale-[0.99]">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.29a1.5 1.5 0 0 0-1.6-.23L3.4 11.1c-1.2.5-1.14 2.24.09 2.66l4.2 1.42 1.62 5.1c.32 1 1.6 1.26 2.28.46l2.3-2.7 4.28 3.15c.77.57 1.88.16 2.1-.77l3.2-13.6a1.5 1.5 0 0 0-.53-1.19z"/></svg>
        Telegram botni ochish
      </a>

      <p class="mt-4 text-center text-xs text-slate-500">
        Botda <b class="text-slate-300">“📱 Raqamni yuborish”</b> tugmasini bosing, kelgan 4 xonali kodni kiriting.
      </p>

      <!-- Kod kataklari -->
      <div class="mt-5">
        <div id="codeBoxes" class="flex justify-center gap-2.5 sm:gap-3" dir="ltr">
          <input class="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="1-raqam" />
          <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="2-raqam" />
          <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="3-raqam" />
          <input class="otp" type="text" inputmode="numeric" maxlength="1" aria-label="4-raqam" />
        </div>
        <p id="codeState" class="mt-4 text-center text-xs text-slate-500"></p>
      </div>
    </div>

    <p class="mt-6 text-center text-sm text-slate-500">
      <a href="login.html" class="font-semibold text-violet-300 hover:underline">← Ro'yxatdan o'tishga qaytish</a>
    </p>
  </div>

  <script>
    (function () {
      'use strict';
      const $ = (s) => document.querySelector(s);
      const boxes = Array.from(document.querySelectorAll('.otp'));

      // Ro'yxatdan o'tish ma'lumoti (login.html saqlagan)
      let pending = null;
      try { pending = JSON.parse(sessionStorage.getItem('sotibber_pending_reg') || 'null'); } catch (e) {}
      if (!pending || !pending.username || !pending.password || !pending.phone) {
        window.location.replace('login.html?tab=register');
        return;
      }

      const BOT = (window.TELEGRAM_BOT_USERNAME || '').replace(/^@/, '');
      if (BOT) {
        const deep = 'https://t.me/' + BOT + '?start=go';
        $('#openBot').href = deep;
        $('#botLink').href = deep;
        $('#botLink').textContent = '@' + BOT;
      } else {
        showMsg("Bot sozlanmagan: supabase-config.js dagi TELEGRAM_BOT_USERNAME ni to'ldiring.", 'error');
      }

      function showMsg(text, kind) {
        const el = $('#msg');
        el.textContent = text;
        el.className = 'mt-5 rounded-xl px-4 py-3 text-sm font-medium ' +
          (kind === 'error'
            ? 'bg-rose-500/15 text-rose-300 ring-1 ring-rose-500/30'
            : 'bg-emerald-500/15 text-emerald-300 ring-1 ring-emerald-500/30');
        el.classList.remove('hidden');
      }
      function hideMsg() { $('#msg').classList.add('hidden'); }

      function getCode() { return boxes.map((b) => b.value).join('').replace(/\D/g, ''); }
      function clearBoxes() { boxes.forEach((b) => { b.value = ''; b.classList.remove('filled'); }); boxes[0].focus(); }

      let verifying = false;
      async function verifyCode() {
        const code = getCode();
        if (code.length !== 4 || verifying) return;
        verifying = true;
        hideMsg();
        $('#codeState').textContent = 'Tekshirilmoqda…';

        const { data, error } = await window.sb.rpc('tg_check_code', { p_phone: pending.phone, p_code: code });
        if (error) {
          verifying = false;
          $('#codeState').textContent = '';
          showMsg("Xatolik yuz berdi. (Supabase'da SQL o'rnatilganini tekshiring)", 'error');
          return;
        }
        if (!data || !data.ok) {
          verifying = false;
          const reason = data && data.reason;
          const m = reason === 'no_code' ? "Bu raqam uchun kod yo'q. Avval botda “Raqamni yuborish”ni bosing (raqamingiz ro'yxatdagi bilan bir xil bo'lsin)."
                  : reason === 'expired' ? 'Kod muddati tugagan. Botda yangi kod oling.'
                  : reason === 'locked'  ? "Juda ko'p urinish. Botda yangi kod oling."
                  : "Kod noto'g'ri. Qayta tekshiring.";
          showMsg(m, 'error');
          clearBoxes();
          $('#codeState').textContent = '';
          return;
        }

        // Tasdiqlandi ✓
        $('#codeState').textContent = "Ro'yxatdan o'tkazilmoqda…";
        pending.phone = data.phone || pending.phone;
        pending.phone_verified = true;
        try { sessionStorage.setItem('sotibber_pending_reg', JSON.stringify(pending)); } catch (e) {}
        window.location.replace('login.html?step=verified');
      }

      // Katak (OTP) boshqaruvi
      boxes.forEach((box, i) => {
        box.addEventListener('input', () => {
          box.value = box.value.replace(/\D/g, '').slice(0, 1);
          box.classList.toggle('filled', !!box.value);
          if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
          if (getCode().length === 4) verifyCode();
        });
        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !box.value && i > 0) {
            boxes[i - 1].focus();
            boxes[i - 1].value = '';
            boxes[i - 1].classList.remove('filled');
            e.preventDefault();
          } else if (e.key === 'ArrowLeft' && i > 0) {
            boxes[i - 1].focus(); e.preventDefault();
          } else if (e.key === 'ArrowRight' && i < boxes.length - 1) {
            boxes[i + 1].focus(); e.preventDefault();
          }
        });
        box.addEventListener('paste', (e) => {
          e.preventDefault();
          const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
          if (!digits) return;
          boxes.forEach((b, k) => { b.value = digits[k] || ''; b.classList.toggle('filled', !!b.value); });
          (boxes[Math.min(digits.length, 3)]).focus();
          if (digits.length === 4) verifyCode();
        });
      });

      boxes[0].focus();
    })();
  </script>
</body>
</html>
