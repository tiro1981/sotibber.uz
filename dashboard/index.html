<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sotibber.uz — Boshqaruv paneli</title>
  <meta name="description" content="Sotibber.uz boshqaruv paneli — Sotuvchi va Sotib beruvchi panellari." />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            indigo: { brand: '#4338CA', deep: '#312E81' },
            emerald: { brand: '#059669' },
          },
          keyframes: {
            slideIn: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(0)' } },
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            fadeUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
          },
          animation: {
            slideIn: 'slideIn 0.3s cubic-bezier(0.16,1,0.3,1)',
            fadeIn: 'fadeIn 0.2s ease',
            fadeUp: 'fadeUp 0.35s ease both',
          },
        },
      },
    };
  </script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-slate-100 font-sans text-slate-800">

  <!-- ===================== APP SHELL ===================== -->
  <div class="flex min-h-screen">

    <!-- ============ SIDEBAR ============ -->
    <!-- Mobile overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 z-30 hidden bg-slate-900/50 backdrop-blur-sm lg:hidden"></div>

    <aside id="sidebar"
      class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col bg-indigo-deep text-indigo-100 transition-transform duration-300 lg:translate-x-0">

      <div class="flex h-16 flex-shrink-0 items-center gap-2 border-b border-white/10 px-6">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-brand to-emerald-brand text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="text-xl font-extrabold tracking-tight text-white">sotibber<span class="text-emerald-400">.uz</span></span>
      </div>

      <!-- Panel label -->
      <div class="px-6 pt-5">
        <p id="panelLabel" class="text-[11px] font-bold uppercase tracking-wider text-indigo-300"></p>
      </div>

      <!-- Nav (rendered by JS) -->
      <nav id="sidebarNav" class="flex-1 space-y-1 overflow-y-auto px-4 py-4"></nav>

      <!-- Sidebar footer / help -->
      <div class="flex-shrink-0 border-t border-white/10 p-4">
        <div class="rounded-2xl bg-white/5 p-4">
          <p class="text-sm font-semibold text-white">Yordam kerakmi?</p>
          <p class="mt-1 text-xs text-indigo-300">24/7 qo'llab-quvvatlash xizmati</p>
          <a href="#" class="mt-3 inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-400 hover:text-emerald-300">
            Telegram support
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
          </a>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN COLUMN ============ -->
    <div class="flex min-w-0 flex-1 flex-col lg:pl-72">

      <!-- ==== TOP HEADER ==== -->

        <button id="openSidebar" class="grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-slate-100 lg:hidden" aria-label="Menyu">

        </button>

        <!-- Current view title -->
        <h1 id="viewTitle" class="min-w-0 flex-1 truncate text-base font-bold text-slate-900 sm:text-lg"></h1>

        <!-- Notifications -->
        <button class="relative grid h-10 w-10 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="Bildirishnomalar">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
        </button>

        <!-- Profile dropdown -->
        <div class="relative">
          <button id="profileBtn" class="flex items-center gap-2 rounded-xl p-1 pr-2 transition hover:bg-slate-100">
            <span id="profileAvatar" class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-indigo-brand to-emerald-brand text-white">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </span>
            <span class="hidden text-left sm:block">
              <span id="profileName" class="block text-sm font-semibold leading-tight text-slate-900">Foydalanuvchi</span>
              <span id="profileRole" class="block text-[11px] leading-tight text-slate-500"></span>
            </span>
            <svg class="hidden h-4 w-4 text-slate-400 sm:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <!-- Dropdown menu -->
          <div id="profileMenu" class="absolute right-0 mt-2 hidden w-56 origin-top-right animate-fadeIn rounded-2xl border border-slate-100 bg-white p-2 shadow-xl">
            <div class="border-b border-slate-100 px-3 py-2">
              <p id="profileNameFull" class="text-sm font-semibold text-slate-900">Foydalanuvchi</p>
              <p id="profilePhone" class="text-xs text-slate-500">Telefon raqami qo'shilmagan</p>
            </div>
            <a href="#" class="mt-1 flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">
              <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              Profilim
            </a>
            <a href="#" class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">
              <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.32 4.32a2 2 0 013.36 0l.6 1a2 2 0 002.05.96l1.14-.2a2 2 0 012.19 2.73l-.44 1.07a2 2 0 00.44 2.18l.85.83a2 2 0 010 2.86l-.85.83a2 2 0 00-.44 2.18l.44 1.07a2 2 0 01-2.19 2.73l-1.14-.2a2 2 0 00-2.05.96l-.6 1a2 2 0 01-3.36 0l-.6-1a2 2 0 00-2.05-.96l-1.14.2a2 2 0 01-2.19-2.73l.44-1.07a2 2 0 00-.44-2.18l-.85-.83a2 2 0 010-2.86l.85-.83a2 2 0 00.44-2.18L4.3 8.81a2 2 0 012.19-2.73l1.14.2a2 2 0 002.05-.96l.6-1z"/><circle cx="12" cy="12" r="2.5"/></svg>
              Sozlamalar
            </a>
            <div class="mt-1 border-t border-slate-100 pt-1">
              <a href="../landing/index.html" class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium text-rose-600 hover:bg-rose-50">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Chiqish
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- ==== MAIN CONTENT (rendered by JS) ==== -->
      <main id="viewRoot" class="flex-1 p-4 sm:p-6 lg:p-8"></main>
    </div>
  </div>

  <!-- ===================== MODAL / DRAWER ROOT ===================== -->
  <div id="modalRoot"></div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[60] hidden -translate-x-1/2">
    <div class="flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-3 text-sm font-medium text-white shadow-2xl">
      <svg class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      <span id="toastMsg">Bajarildi</span>
    </div>
  </div>

  <!-- ===================== APPLICATION SCRIPT ===================== -->
  <script src="script.js"></script>
</body>
</html>
