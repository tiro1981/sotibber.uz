<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sotibber.uz — Boshqaruv paneli</title>
  <meta name="description" content="Sotibber.uz boshqaruv paneli — Sotuvchi va Sotib beruvchi panellari." />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter + Space Grotesk fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Space Grotesk', 'Inter', 'sans-serif'] },
          colors: {
            indigo: { brand: '#4338CA', deep: '#312E81' },
            violet: { brand: '#7c3aed', deep: '#4f46e5' },
            ink: { 900: '#07060d', 800: '#0d0b18' },
            emerald: { brand: '#059669' },
          },
          keyframes: {
            slideIn: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(0)' } },
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            fadeUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
          },
          animation: {
            slideIn: 'slideIn 0.3s cubic-bezier(0.16,1,0.3,1)',
            fadeIn: 'fadeIn 0.2s ease',
            fadeUp: 'fadeUp 0.35s ease both',
          },
        },
      },
    };
  </script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css?v=20260819-3" />

  <!-- Mavzu (dark/light) — sahifa yuklanishidan oldin qo'llaymiz (miltillashsiz) -->
  <script>
    (function () { try { if (localStorage.getItem('sotibber_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {} })();
  </script>
</head>

<body class="font-sans text-slate-200 antialiased">

  <!-- Fluid iridescent orbs (fon) -->
  <div class="orb orb-warm right-[-80px] top-[-60px] h-[360px] w-[440px]"></div>
  <div class="orb orb-cool left-[10%] top-[40%] h-[320px] w-[380px]"></div>
  <div class="orb orb-iris right-[6%] bottom-[-80px] h-[340px] w-[420px]"></div>

  <!-- ===================== APP SHELL ===================== -->
  <div class="flex min-h-screen">

    <!-- ============ SIDEBAR ============ -->
    <!-- Mobile overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 z-30 hidden bg-black/60 backdrop-blur-sm lg:hidden"></div>

    <aside id="sidebar"
      class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-white/5 bg-ink-900/80 text-slate-300 backdrop-blur-xl transition-transform duration-300 lg:translate-x-0">
      <!-- Logo -->
      <div class="flex h-16 flex-shrink-0 items-center gap-2 border-b border-white/5 px-6">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-violet-brand to-violet-deep text-white shadow-lg shadow-violet-500/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="font-display text-xl font-bold tracking-tight text-white">sotibber<span class="text-violet-400">.uz</span></span>
      </div>

      <!-- Panel label -->
      <div class="px-6 pt-5">
        <p id="panelLabel" class="text-[11px] font-bold uppercase tracking-wider text-violet-300"></p>
      </div>

      <!-- Nav (rendered by JS) -->
      <nav id="sidebarNav" class="flex-1 space-y-1 overflow-y-auto px-4 py-4"></nav>

      <!-- Sidebar footer / help -->
      <div class="flex-shrink-0 border-t border-white/5 p-4">
        <div class="glass rounded-2xl p-4">
          <p class="text-sm font-semibold text-white">Yordam kerakmi?</p>
          <p class="mt-1 text-xs text-slate-400">24/7 qo'llab-quvvatlash xizmati</p>
          <a href="#" class="mt-3 inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-400 hover:text-emerald-300">
            Telegram support
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
          </a>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN COLUMN ============ -->
    <div class="flex min-w-0 flex-1 flex-col lg:pl-72">

      <!-- ==== TOP HEADER ==== -->
      <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-white/5 bg-ink-900/70 px-4 backdrop-blur-xl sm:px-6">
        <!-- Mobile hamburger -->
        <button id="openSidebar" class="grid h-10 w-10 place-items-center rounded-xl text-slate-300 hover:bg-white/10 lg:hidden" aria-label="Menyu">

        <!-- Current view title -->
        <h1 id="viewTitle" class="min-w-0 flex-1 truncate font-display text-base font-bold text-white sm:text-lg"></h1>

        <!-- Dark / Light toggle -->
        <button id="themeToggle" class="grid h-10 w-10 place-items-center rounded-xl text-slate-300 hover:bg-white/10" aria-label="Mavzu (dark/light)" title="Dark / Light">
          <svg id="themeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"></svg>
        </button>

        <!-- Notifications -->
        <div class="relative">
          <button id="notifBtn" class="relative grid h-10 w-10 place-items-center rounded-xl text-slate-300 hover:bg-white/10" aria-label="Bildirishnomalar">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span id="notifDot" class="absolute right-2 top-2 hidden h-2 w-2 rounded-full bg-rose-500 ring-2 ring-ink-900"></span>
          </button>
          <!-- Notifications dropdown -->
          <div id="notifMenu" class="glass absolute right-0 mt-2 hidden w-80 max-w-[calc(100vw-1.5rem)] origin-top-right animate-fadeIn rounded-2xl shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/10 px-4 py-3">
              <p id="notifTitle" class="text-sm font-bold text-white">Bildirishnomalar</p>
            </div>
            <div id="notifList" class="max-h-96 overflow-y-auto p-2"></div>
          </div>
        </div>

        <!-- Profile dropdown -->
        <div class="relative">
          <button id="profileBtn" class="flex items-center gap-2 rounded-xl p-1 pr-2 transition hover:bg-white/10">
            <span id="profileAvatar" class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-white shadow-lg shadow-violet-500/30">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </span>
            <span class="hidden text-left sm:block">
              <span id="profileName" class="block text-sm font-semibold leading-tight text-white">Foydalanuvchi</span>
              <span id="profileRole" class="block text-[11px] leading-tight text-slate-400"></span>
            </span>
            <svg class="hidden h-4 w-4 text-slate-500 sm:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <!-- Dropdown menu -->
          <div id="profileMenu" class="glass absolute right-0 mt-2 hidden w-56 origin-top-right animate-fadeIn rounded-2xl p-2 shadow-2xl">
            <div class="border-b border-white/10 px-3 py-2">
              <p id="profileNameFull" class="text-sm font-semibold text-white">Foydalanuvchi</p>
              <p id="profilePhone" class="text-xs text-slate-400">Telefon raqami qo'shilmagan</p>
            </div>
            <a href="#" id="profileLink" class="mt-1 flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-slate-200 hover:bg-white/10">
              <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span data-i18n="Profilim">Profilim</span>
            </a>
            <a href="#" id="settingsLink" class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-slate-200 hover:bg-white/10">
              <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.32 4.32a2 2 0 013.36 0l.6 1a2 2 0 002.05.96l1.14-.2a2 2 0 012.19 2.73l-.44 1.07a2 2 0 00.44 2.18l.85.83a2 2 0 010 2.86l-.85.83a2 2 0 00-.44 2.18l.44 1.07a2 2 0 01-2.19 2.73l-1.14-.2a2 2 0 00-2.05.96l-.6 1a2 2 0 01-3.36 0l-.6-1a2 2 0 00-2.05-.96l-1.14.2a2 2 0 01-2.19-2.73l.44-1.07a2 2 0 00-.44-2.18l-.85-.83a2 2 0 010-2.86l.85-.83a2 2 0 00.44-2.18L4.3 8.81a2 2 0 012.19-2.73l1.14.2a2 2 0 002.05-.96l.6-1z"/><circle cx="12" cy="12" r="2.5"/></svg>
              <span data-i18n="Sozlamalar">Sozlamalar</span>
            </a>
            <div class="mt-1 border-t border-white/10 pt-1">
              <a href="#" id="logoutBtn" class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium text-rose-300 hover:bg-rose-500/10">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                <span data-i18n="Chiqish">Chiqish</span>
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- ==== MAIN CONTENT (rendered by JS) ==== -->
      <main id="viewRoot" class="flex-1 p-4 sm:p-6 lg:p-8"></main>
    </div>
  </div>

  <!-- ===================== MODAL / DRAWER ROOT ===================== -->
  <div id="modalRoot"></div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[80] hidden -translate-x-1/2">
    <div class="glass flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-medium text-white shadow-2xl">
      <svg class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      <span id="toastMsg">Bajarildi</span>
    </div>
  </div>

  <!-- ===================== SUPPORT CHAT WIDGET (foydalanuvchi -> admin) ===================== -->
  <div id="supportChat" class="fixed bottom-5 right-5 z-[70]">
    <!-- Ochish tugmasi -->
    <button id="scToggle" class="btn-grad relative grid h-14 w-14 place-items-center rounded-full text-white transition hover:scale-105 active:scale-95" aria-label="Yordam chat">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4-.8L3 20l.8-4.2A7.9 7.9 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <span id="scUnread" class="absolute -right-0.5 -top-0.5 hidden min-w-[20px] rounded-full bg-rose-500 px-1 text-center text-[11px] font-bold leading-5 text-white ring-2 ring-ink-900"></span>
    </button>

    <!-- Chat oynasi -->
    <div id="scPanel" class="glass absolute bottom-16 right-0 hidden w-[calc(100vw-2.5rem)] max-w-sm overflow-hidden rounded-2xl shadow-2xl">
      <div class="flex items-center justify-between bg-gradient-to-r from-violet-brand to-violet-deep px-4 py-3 text-white">
        <div class="flex items-center gap-2">
          <span class="grid h-8 w-8 place-items-center rounded-full bg-white/20">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0z"/></svg>
          </span>
          <div>
            <p class="text-sm font-bold leading-tight">Qo'llab-quvvatlash</p>
            <p class="text-[11px] leading-tight text-violet-100">Savolingizni yozing — javob beramiz</p>
          </div>
        </div>
        <button id="scClose" class="grid h-8 w-8 place-items-center rounded-lg text-white/80 hover:bg-white/15 hover:text-white" aria-label="Yopish">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="scThread" class="h-80 space-y-2.5 overflow-y-auto bg-black/20 p-4 text-sm"></div>
      <form id="scForm" class="flex items-center gap-2 border-t border-white/10 p-3">
        <input id="scInput" type="text" autocomplete="off" placeholder="Xabar yozing..." class="fld flex-1 rounded-xl px-3.5 py-2.5 text-sm outline-none" />
        <button type="submit" class="btn-grad grid h-10 w-10 shrink-0 place-items-center rounded-xl text-white transition active:scale-95">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </form>
    </div>
  </div>

  <!-- ===================== SUPABASE + AUTH ===================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="uzphone.js?v=20260819-1"></script>

  <!-- app-init.js foydalanuvchi login qilganini tekshiradi, Supabase'dan
       ma'lumotlarni oldindan yuklaydi, so'ng script.js'ni ishga tushiradi. -->
  <script src="app-init.js?v=20260819-13"></script>

  <!-- Support chat mantiq -->
  <script>
  (function () {
    'use strict';
    const $ = (s) => document.querySelector(s);
    const sb = window.sb;
    if (!sb) return;

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let userId = null;
    let messages = [];
    let open = false;
    let pollTimer = null;

    const panel = $('#scPanel'), thread = $('#scThread'), unreadDot = $('#scUnread');

    function renderThread() {
      if (!messages.length) {
        thread.innerHTML = '<p class="mt-6 text-center text-xs text-slate-400">Savolingizni yozing — administrator tez orada javob beradi.</p>';
        return;
      }
      thread.innerHTML = messages.map((m) => {
        const mine = m.sender === 'user';
        return `
          <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[80%] rounded-2xl px-3 py-2 ${mine ? 'bg-gradient-to-br from-violet-brand to-violet-deep text-white' : 'bg-white/8 text-slate-100 ring-1 ring-white/10'}">
              <p class="whitespace-pre-wrap break-words">${esc(m.body)}</p>
            </div>
          </div>`;
      }).join('');
      thread.scrollTop = thread.scrollHeight;
    }

    function updateUnread() {
      const n = messages.filter((m) => m.sender === 'admin' && !m.read_by_user).length;
      if (n > 0 && !open) { unreadDot.textContent = n; unreadDot.classList.remove('hidden'); }
      else unreadDot.classList.add('hidden');
    }

    async function load() {
      if (!userId) return;
      const { data, error } = await sb.from('support_messages').select('*').eq('user_id', userId).order('created_at', { ascending: true });
      if (error) { console.error('Chat yuklash:', error); return; }
      messages = data || [];
      if (open) renderThread();
      updateUnread();
    }

    async function markAdminRead() {
      const ids = messages.filter((m) => m.sender === 'admin' && !m.read_by_user).map((m) => m.id);
      if (!ids.length) return;
      messages.forEach((m) => { if (ids.includes(m.id)) m.read_by_user = true; });
      updateUnread();
      try { await sb.from('support_messages').update({ read_by_user: true }).in('id', ids); } catch (e) { console.error(e); }
    }

    function openPanel() {
      open = true;
      panel.classList.remove('hidden');
      renderThread();
      markAdminRead();
    }
    function closePanel() { open = false; panel.classList.add('hidden'); }

    $('#scToggle').addEventListener('click', () => (open ? closePanel() : openPanel()));
    $('#scClose').addEventListener('click', closePanel);

    $('#scForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('#scInput');
      const body = input.value.trim();
      if (!body || !userId) return;
      input.value = '';
      const { data, error } = await sb.from('support_messages')
        .insert({ user_id: userId, sender: 'user', body, read_by_user: true })
        .select().single();
      if (error) { console.error(error); input.value = body; return; }
      messages.push(data);
      renderThread();
    });

    // Sessiyani olib, chatni ishga tushiramiz
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { $('#supportChat').classList.add('hidden'); return; }
      userId = session.user.id;
      await load();
      // Har 15 soniyada yangi javoblarni tekshiramiz
      pollTimer = setInterval(load, 15000);
    })();
  })();
  </script>
</body>
</html>
