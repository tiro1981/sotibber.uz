<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kirish — sotibber.uz</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Space Grotesk', 'Inter', 'sans-serif'] },
          colors: { violet: { brand: '#7c3aed', deep: '#4f46e5' }, ink: { 900: '#07060d', 800: '#0d0b18' } },
        },
      },
    };
  </script>

  <style>
    body {
      background:
        radial-gradient(820px 480px at 50% -10%, rgba(255,122,60,.12), transparent 60%),
        radial-gradient(700px 460px at 85% 6%, rgba(99,102,241,.14), transparent 58%),
        radial-gradient(680px 440px at 10% 100%, rgba(236,72,153,.10), transparent 55%),
        #040406;
      color: #e9e7ef;
      overflow-x: hidden;
    }
    .font-display { letter-spacing: -0.01em; }

    /* Fluid iridescent orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(48px); opacity: .8;
      pointer-events: none; z-index: 0; mix-blend-mode: screen;
      will-change: transform, border-radius;
    }
    .orb-warm { background: radial-gradient(60% 60% at 32% 30%, #ffb15a 0%, #ff6a2e 38%, rgba(255,61,74,.65) 62%, transparent 78%); animation: morph 16s ease-in-out infinite; }
    .orb-cool { background: radial-gradient(60% 60% at 60% 40%, #6ea8ff 0%, #4f6bff 40%, rgba(124,58,237,.6) 66%, transparent 80%); animation: morph 20s ease-in-out infinite reverse; }
    .orb-iris { background: radial-gradient(55% 55% at 40% 45%, #37e0c8 0%, #7c9cff 35%, #d95cff 62%, transparent 80%); animation: morph 24s ease-in-out infinite; }
    @keyframes morph {
      0%,100% { border-radius: 44% 56% 62% 38% / 46% 42% 58% 54%; transform: translate(0,0) rotate(0deg) scale(1); }
      33%     { border-radius: 62% 38% 44% 56% / 58% 60% 40% 42%; transform: translate(3%, -3%) rotate(28deg) scale(1.07); }
      66%     { border-radius: 38% 62% 56% 44% / 42% 46% 54% 58%; transform: translate(-3%, 3%) rotate(-22deg) scale(.95); }
    }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none !important; } }

    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .btn-grad {
      background: linear-gradient(135deg, #ff8a3d 0%, #ff4d6a 48%, #8b5cf6 100%);
      color: #fff;
      box-shadow: 0 14px 40px -12px rgba(255,90,80,0.6), inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .btn-grad:hover { box-shadow: 0 18px 52px -10px rgba(255,90,80,0.78); }
    .fld {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      color: #f1f0f7;
    }
    .fld::placeholder { color: #6b7280; }
    .fld:focus { border-color: rgba(255,138,80,0.6); box-shadow: 0 0 0 3px rgba(255,138,80,0.16); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="uzphone.js?v=20260819-1"></script>
</head>

<body class="relative flex min-h-screen items-center justify-center overflow-hidden p-4 font-sans text-slate-200 antialiased">

  <!-- Suyuq iridescent blob'lar -->
  <div class="orb orb-warm right-[-60px] top-[-40px] h-[340px] w-[420px]"></div>
  <div class="orb orb-cool left-[-80px] top-[30%] h-[320px] w-[380px]"></div>
  <div class="orb orb-iris left-1/2 bottom-[-80px] h-[360px] w-[460px] -translate-x-1/2"></div>

  <div class="relative z-10 w-full max-w-md">
    <!-- Logo -->
    <div class="mb-6 flex items-center justify-center gap-2">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-violet-brand to-violet-deep text-white shadow-lg shadow-violet-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="font-display text-2xl font-bold tracking-tight text-white">sotibber<span class="text-violet-400">.uz</span></span>
    </div>

    <div class="glass rounded-3xl p-6 shadow-2xl sm:p-8">

      <!-- ============ AUTH VIEW (kirish / ro'yxatdan o'tish) ============ -->
      <div id="authView">

      <!-- Tabs -->
      <div class="mb-6 grid grid-cols-2 gap-2 border-b border-white/10">
        <button type="button" data-tab="login" data-i18n="tab_login" class="tab-btn border-b-2 pb-3 text-sm font-bold transition">Kirish</button>
        <button type="button" data-tab="register" data-i18n="tab_register" class="tab-btn border-b-2 pb-3 text-sm font-bold transition">Ro'yxatdan o'tish</button>
      </div>

      <!-- Error / info banner -->
      <div id="formMsg" class="mb-4 hidden rounded-xl px-4 py-3 text-sm font-medium"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-4">
        <label class="block">
          <span data-i18n="email" class="text-sm font-semibold text-slate-300">Email</span>
          <input required type="text" inputmode="email" autocomplete="username" id="loginEmail" data-i18n-ph="ph_email" placeholder="email@misol.uz" class="fld mt-1.5 w-full rounded-xl px-3.5 py-2.5 text-sm outline-none" />
        </label>
        <label class="block">
          <span data-i18n="password" class="text-sm font-semibold text-slate-300">Parol</span>
          <input required type="password" id="loginPassword" placeholder="••••••••" class="fld mt-1.5 w-full rounded-xl px-3.5 py-2.5 text-sm outline-none" />
        </label>
        <button type="submit" data-i18n="login_btn" class="btn-grad w-full rounded-xl py-3 text-sm font-bold text-white transition active:scale-[0.99]">Kirish</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="hidden space-y-4">
        <label class="block">
          <span data-i18n="reg_name" class="text-sm font-semibold text-slate-300">Ism familiya</span>
          <input required type="text" id="regName" data-i18n-ph="ph_name" placeholder="Ism Familiya" class="fld mt-1.5 w-full rounded-xl px-3.5 py-2.5 text-sm outline-none" />
        </label>
        <label class="block">
          <span class="text-sm font-semibold text-slate-300"><span data-i18n="reg_phone">Telefon raqami</span> <span data-i18n="optional" class="font-normal text-slate-500">(ixtiyoriy)</span></span>
          <input type="tel" id="regPhone" placeholder="+998 90 123 45 67" class="fld mt-1.5 w-full rounded-xl px-3.5 py-2.5 text-sm outline-none" />
        </label>
        <label class="block">
          <span data-i18n="email" class="text-sm font-semibold text-slate-300">Email</span>
          <input required type="email" id="regEmail" data-i18n-ph="ph_email" placeholder="email@misol.uz" class="fld mt-1.5 w-full rounded-xl px-3.5 py-2.5 text-sm outline-none" />
        </label>
        <label class="block">
          <span data-i18n="password" class="text-sm font-semibold text-slate-300">Parol</span>
          <input required type="password" id="regPassword" minlength="6" data-i18n-ph="ph_pass6" placeholder="Kamida 6 belgi" class="fld mt-1.5 w-full rounded-xl px-3.5 py-2.5 text-sm outline-none" />
        </label>
        <button type="submit" data-i18n="register_btn" class="btn-grad w-full rounded-xl py-3 text-sm font-bold text-white transition active:scale-[0.99]">Ro'yxatdan o'tish</button>
      </form>

      </div><!-- /authView -->

      <!-- ============ ROLE VIEW (ro'yxatdan o'tgandan keyin) ============ -->
      <div id="roleView" class="hidden">
        <div class="text-center">
          <h3 data-i18n="welcome" class="font-display text-xl font-bold text-white">Xush kelibsiz! 🎉</h3>
          <p data-i18n="welcome_sub" class="mt-1.5 text-sm text-slate-400">Platformadan qanday maqsadda foydalanasiz?</p>
        </div>
        <div class="mt-6 space-y-3">
          <button type="button" data-role-choice="seller" class="group flex w-full items-center gap-4 rounded-2xl border border-white/10 bg-white/5 p-4 text-left transition hover:border-violet-400/60 hover:bg-violet-500/10">
            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-violet-brand to-violet-deep text-white shadow-lg shadow-violet-500/30 transition group-hover:scale-105">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            </span>
            <span class="min-w-0">
              <span data-i18n="role_seller" class="block text-base font-bold text-white">Sotuvchi</span>
              <span data-i18n="role_seller_d" class="block text-xs text-slate-400">Mahsulotlarimni yuklayman va sotuvlarni oshiraman</span>
            </span>
          </button>
          <button type="button" data-role-choice="affiliate" class="group flex w-full items-center gap-4 rounded-2xl border border-white/10 bg-white/5 p-4 text-left transition hover:border-emerald-400/60 hover:bg-emerald-500/10">
            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-emerald-500 to-teal-500 text-white shadow-lg shadow-emerald-500/30 transition group-hover:scale-105">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V6m0 12v-2"/></svg>
            </span>
            <span class="min-w-0">
              <span data-i18n="role_aff" class="block text-base font-bold text-white">Sotib beruvchi</span>
              <span data-i18n="role_aff_d" class="block text-xs text-slate-400">Sarmoyasiz ijtimoiy tarmoqlarda sotib pul ishlayman</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <p class="mt-6 text-center text-sm text-slate-500">
      <a href="/" data-i18n="back_home" class="font-semibold text-violet-300 hover:underline">← Bosh sahifaga qaytish</a>
    </p>
  </div>

  <script>
    (function () {
      'use strict';
      const $ = (sel) => document.querySelector(sel);

      /* ===== Til (UZ / RU / EN) — dashboard bilan bir xil kalit ===== */
      const I18N = {
        tab_login:      { uz: 'Kirish', ru: 'Вход', en: 'Log in' },
        tab_register:   { uz: "Ro'yxatdan o'tish", ru: 'Регистрация', en: 'Sign up' },
        email:          { uz: 'Email', ru: 'Эл. почта', en: 'Email' },
        password:       { uz: 'Parol', ru: 'Пароль', en: 'Password' },
        login_btn:      { uz: 'Kirish', ru: 'Войти', en: 'Log in' },
        reg_name:       { uz: 'Ism familiya', ru: 'Имя и фамилия', en: 'Full name' },
        reg_phone:      { uz: 'Telefon raqami', ru: 'Номер телефона', en: 'Phone number' },
        optional:       { uz: '(ixtiyoriy)', ru: '(необязательно)', en: '(optional)' },
        register_btn:   { uz: "Ro'yxatdan o'tish", ru: 'Зарегистрироваться', en: 'Sign up' },
        welcome:        { uz: 'Xush kelibsiz! 🎉', ru: 'Добро пожаловать! 🎉', en: 'Welcome! 🎉' },
        welcome_sub:    { uz: 'Platformadan qanday maqsadda foydalanasiz?', ru: 'С какой целью будете пользоваться платформой?', en: 'How will you use the platform?' },
        role_seller:    { uz: 'Sotuvchi', ru: 'Продавец', en: 'Seller' },
        role_seller_d:  { uz: 'Mahsulotlarimni yuklayman va sotuvlarni oshiraman', ru: 'Загружаю свои товары и увеличиваю продажи', en: 'I upload my products and grow sales' },
        role_aff:       { uz: 'Sotib beruvchi', ru: 'Реселлер', en: 'Reseller' },
        role_aff_d:     { uz: 'Sarmoyasiz ijtimoiy tarmoqlarda sotib pul ishlayman', ru: 'Продаю в соцсетях без вложений и зарабатываю', en: 'I sell on social media with no investment and earn' },
        back_home:      { uz: '← Bosh sahifaga qaytish', ru: '← Вернуться на главную', en: '← Back to home' },
        loading:        { uz: 'Yuklanmoqda...', ru: 'Загрузка...', en: 'Loading...' },
        ph_email:       { uz: 'email@misol.uz', ru: 'email@primer.uz', en: 'email@example.uz' },
        ph_name:        { uz: 'Ism Familiya', ru: 'Имя Фамилия', en: 'Full Name' },
        ph_pass6:       { uz: 'Kamida 6 belgi', ru: 'Минимум 6 символов', en: 'At least 6 characters' },
        register_success: {
          uz: "Hisobingiz yaratildi ✓ Emailingizga yuborilgan havolani tasdiqlang, so'ng shu email/parol bilan kiring — rolingiz saqlanadi.",
          ru: 'Аккаунт создан ✓ Подтвердите ссылку, отправленную на почту, затем войдите с этим email/паролем — ваша роль сохранится.',
          en: 'Account created ✓ Confirm the link sent to your email, then log in with this email/password — your role is saved.',
        },
      };
      let LANG = 'uz';
      try { LANG = localStorage.getItem('sotibber_lang') || 'uz'; } catch (e) {}
      if (['uz', 'ru', 'en'].indexOf(LANG) === -1) LANG = 'uz';

      function applyLang(lang) {
        LANG = (['uz', 'ru', 'en'].indexOf(lang) !== -1) ? lang : 'uz';
        try { localStorage.setItem('sotibber_lang', LANG); } catch (e) {}
        document.documentElement.lang = LANG;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const k = el.dataset.i18n; if (I18N[k]) el.textContent = I18N[k][LANG];
        });
        document.querySelectorAll('[data-i18n-ph]').forEach((el) => {
          const k = el.dataset.i18nPh; if (I18N[k]) el.placeholder = I18N[k][LANG];
        });
        // Submit tugmalarining keshlangan matnini tozalash (yangi tilda tiklansin)
        document.querySelectorAll('button[type="submit"]').forEach((b) => { delete b.dataset.orig; });
        // Til tugmalari faol holati
        document.querySelectorAll('[data-lang]').forEach((b) => {
          const on = b.dataset.lang === LANG;
          b.className = `lang-btn rounded-lg px-2.5 py-1 text-xs font-bold transition ${on ? 'bg-white text-ink-900 shadow' : 'text-slate-300 hover:text-white'}`;
        });
      }

      const params = new URLSearchParams(window.location.search);
      // Panel (sotuvchi/sotib beruvchi) endi login paytida emas, ro'yxatdan
      // o'tgandan keyin tanlanadi. Login uchun oldingi/standart qiymatdan
      // foydalanamiz (dashboard ichida ham panelni almashtirish mumkin).
      let panel = params.get('panel') === 'affiliate' ? 'affiliate' : (params.get('panel') === 'seller' ? 'seller' : null);
      if (!panel) {
        try { panel = localStorage.getItem('sotibber_panel'); } catch (e) {}
      }
      if (panel !== 'affiliate' && panel !== 'seller') panel = 'seller';

      // Ro'yxatdan o'tishda kiritilgan ma'lumot (avtomatik kirish uchun)
      let pendingCreds = null;

      // Ro'yxatdan o'tgandan keyingi rol tanlash ekrani
      function showRoleView() {
        hideMsg();
        $('#authView').classList.add('hidden');
        $('#roleView').classList.remove('hidden');
      }
      function showAuthView() {
        $('#roleView').classList.add('hidden');
        $('#authView').classList.remove('hidden');
      }

      // Rol tanlanganda: sessiya bo'lsa dashboardga; bo'lmasa avtomatik
      // kirishga urinamiz (email tasdiqlash o'chirilgan bo'lsa ishlaydi).
      async function chooseRole(role) {
        panel = role === 'affiliate' ? 'affiliate' : 'seller';
        try { localStorage.setItem('sotibber_panel', panel); } catch (e) {}

        let user = await window.SotibberAuth.getUser();
        if (!user && pendingCreds) {
          const { error } = await window.SotibberAuth.signIn(pendingCreds);
          if (!error) user = await window.SotibberAuth.getUser();
        }

        if (user) {
          // Rolni profilga saqlaymiz (admin panel ko'rsatishi uchun)
          try { await window.sb.from('profiles').upsert({ id: user.id, role: panel }, { onConflict: 'id' }); } catch (e) { /* role ustuni bo'lmasa — e'tibor bermaymiz */ }
          goToDashboard();
        } else {
          // Email tasdiqlash yoqiq — sessiya olib bo'lmadi
          showAuthView();
          activeTab = 'login';
          paintTabs();
          showMsg("Hisobingiz yaratildi ✓ Emailingizga yuborilgan havolani tasdiqlang, so'ng shu email/parol bilan kiring — rolingiz saqlanadi.", 'success');
        }
      }

      document.querySelectorAll('[data-role-choice]').forEach((b) => {
        b.addEventListener('click', () => {
          b.disabled = true;
          chooseRole(b.dataset.roleChoice).finally(() => { b.disabled = false; });
        });
      });

      // Tabs — landing'dan ?tab=register bilan kelsa, ro'yxatdan o'tish ochiladi
      let activeTab = params.get('tab') === 'register' ? 'register' : 'login';
      function paintTabs() {
        document.querySelectorAll('.tab-btn').forEach((b) => {
          const on = b.dataset.tab === activeTab;
          b.className = `tab-btn border-b-2 pb-3 text-sm font-bold transition ${on ? 'border-violet-400 text-white' : 'border-transparent text-slate-500 hover:text-slate-300'}`;
        });
        $('#loginForm').classList.toggle('hidden', activeTab !== 'login');
        $('#registerForm').classList.toggle('hidden', activeTab !== 'register');
        hideMsg();
      }
      paintTabs();
      document.querySelectorAll('.tab-btn').forEach((b) => {
        b.addEventListener('click', () => { activeTab = b.dataset.tab; paintTabs(); });
      });

      // Til almashtirgich (UZ/RU/EN) — tugmalarni ulaymiz va tanlangan tilni qo'llaymiz
      document.querySelectorAll('[data-lang]').forEach((b) => {
        b.addEventListener('click', () => applyLang(b.dataset.lang));
      });
      applyLang(LANG);

      // Admin tomonidan bloklangan bo'lsa — ogohlantirish
      if (params.get('blocked')) {
        showMsg("Akkauntingiz administrator tomonidan bloklangan. Iltimos, qo'llab-quvvatlash bilan bog'laning.", 'error');
      }

      function showMsg(text, kind) {
        const el = $('#formMsg');
        el.textContent = text;
        el.className = `mb-4 rounded-xl px-4 py-3 text-sm font-medium ${kind === 'error' ? 'bg-rose-500/15 text-rose-300 ring-1 ring-rose-500/30' : 'bg-emerald-500/15 text-emerald-300 ring-1 ring-emerald-500/30'}`;
        el.classList.remove('hidden');
      }
      function hideMsg() { $('#formMsg').classList.add('hidden'); }

      function setLoading(form, loading) {
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = loading;
        btn.dataset.orig = btn.dataset.orig || btn.textContent;
        btn.textContent = loading ? 'Yuklanmoqda...' : btn.dataset.orig;
      }

      function goToDashboard() {
        try { localStorage.setItem('sotibber_panel', panel); } catch (e) {}
        window.location.href = `index.html?panel=${panel}`;
      }

      // Agar allaqachon login qilingan bo'lsa, to'g'ridan-to'g'ri dashboard'ga
      (async () => {
        const user = await window.SotibberAuth.getUser();
        if (user) goToDashboard();
      })();

      // Maxfiy admin kirishi — login maydoniga maxsus login/parol kiritilsa,
      // Supabase'ga bormasdan to'g'ridan-to'g'ri admin panelга o'tadi.
      const ADMIN_USER = 'tiro';
      const ADMIN_PASS = 'tiro19';

      $('#loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMsg();

        const loginVal = $('#loginEmail').value.trim();
        const passVal = $('#loginPassword').value;
        if (loginVal.toLowerCase() === ADMIN_USER && passVal === ADMIN_PASS) {
          try { sessionStorage.setItem('sotibber_admin', '1'); } catch (err) {}
          window.location.href = 'admin.html';
          return;
        }

        setLoading(e.target, true);
        const { error } = await window.SotibberAuth.signIn({
          email: loginVal,
          password: passVal,
        });
        setLoading(e.target, false);
        if (error) return showMsg(window.SotibberAuth.translateError(error), 'error');
        goToDashboard();
      });

      $('#registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMsg();
        const email = $('#regEmail').value.trim();
        const password = $('#regPassword').value;

        setLoading(e.target, true);
        const { error } = await window.SotibberAuth.signUp({
          email,
          password,
          fullName: $('#regName').value.trim(),
          phone: (window.uzPhoneDigits && window.uzPhoneDigits($('#regPhone').value) === 0) ? '' : $('#regPhone').value.trim(),
        });
        setLoading(e.target, false);
        if (error) return showMsg(window.SotibberAuth.translateError(error), 'error');

        // Ro'yxatdan o'tildi — endi DOIM rol tanlash ekranini ko'rsatamiz.
        // Kiritilgan ma'lumotni saqlaymiz: rol tanlaganda sessiya bo'lmasa,
        // shu bilan avtomatik kirishga urinamiz (chooseRole ичida).
        pendingCreds = { email, password };
        showRoleView();
      });
    })();
  </script>
</body>
</html>
