<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kirish — sotibber.uz</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { indigo: { brand: '#4338CA', deep: '#312E81' }, emerald: { brand: '#059669' } },
        },
      },
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-100 p-4 font-sans text-slate-800">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="mb-6 flex items-center justify-center gap-2">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-indigo-brand to-emerald-brand text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="text-2xl font-extrabold tracking-tight text-slate-900">sotibber<span class="text-emerald-brand">.uz</span></span>
    </div>

    <div class="rounded-2xl border border-slate-100 bg-white p-6 shadow-xl sm:p-8">

      <!-- Panel tanlash -->
      <div class="mb-5">
        <p class="mb-2 text-center text-xs font-semibold uppercase tracking-wide text-slate-400">Qaysi panelga kirmoqchisiz?</p>
        <div id="panelToggle" class="grid grid-cols-2 gap-2 rounded-xl bg-slate-100 p-1">
          <button type="button" data-panel="seller" class="panel-opt rounded-lg py-2 text-sm font-semibold transition">Sotuvchi</button>
          <button type="button" data-panel="affiliate" class="panel-opt rounded-lg py-2 text-sm font-semibold transition">Sotib beruvchi</button>
        </div>
      </div>

      <!-- Tabs -->
      <div class="mb-6 grid grid-cols-2 gap-2 border-b border-slate-100">
        <button type="button" data-tab="login" class="tab-btn border-b-2 pb-3 text-sm font-bold transition">Kirish</button>
        <button type="button" data-tab="register" class="tab-btn border-b-2 pb-3 text-sm font-bold transition">Ro'yxatdan o'tish</button>
      </div>

      <!-- Error / info banner -->
      <div id="formMsg" class="mb-4 hidden rounded-xl px-4 py-3 text-sm font-medium"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-4">
        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Email</span>
          <input required type="email" id="loginEmail" placeholder="email@misol.uz" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-brand focus:ring-2 focus:ring-indigo-100" />
        </label>
        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Parol</span>
          <input required type="password" id="loginPassword" placeholder="••••••••" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-brand focus:ring-2 focus:ring-indigo-100" />
        </label>
        <button type="submit" class="w-full rounded-xl bg-indigo-brand py-3 text-sm font-bold text-white shadow-lg shadow-indigo-500/25 transition hover:bg-indigo-deep">Kirish</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="hidden space-y-4">
        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Ism familiya</span>
          <input required type="text" id="regName" placeholder="Ism Familiya" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-brand focus:ring-2 focus:ring-indigo-100" />
        </label>
        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Telefon raqami <span class="font-normal text-slate-400">(ixtiyoriy)</span></span>
          <input type="tel" id="regPhone" placeholder="+998 90 123 45 67" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-brand focus:ring-2 focus:ring-indigo-100" />
        </label>
        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Email</span>
          <input required type="email" id="regEmail" placeholder="email@misol.uz" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-brand focus:ring-2 focus:ring-indigo-100" />
        </label>
        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Parol</span>
          <input required type="password" id="regPassword" minlength="6" placeholder="Kamida 6 belgi" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-brand focus:ring-2 focus:ring-indigo-100" />
        </label>
        <button type="submit" class="w-full rounded-xl bg-emerald-brand py-3 text-sm font-bold text-white shadow-lg shadow-emerald-500/25 transition hover:opacity-90">Ro'yxatdan o'tish</button>
      </form>
    </div>

    <p class="mt-6 text-center text-sm text-slate-500">
      <a href="../landing/index.html" class="font-semibold text-indigo-brand hover:underline">← Bosh sahifaga qaytish</a>
    </p>
  </div>

  <script>
    (function () {
      'use strict';
      const $ = (sel) => document.querySelector(sel);

      const params = new URLSearchParams(window.location.search);
      let panel = params.get('panel') === 'affiliate' ? 'affiliate' : (params.get('panel') === 'seller' ? 'seller' : null);
      if (!panel) {
        try { panel = localStorage.getItem('sotibber_panel'); } catch (e) {}
      }
      if (panel !== 'affiliate' && panel !== 'seller') panel = 'seller';

      function paintPanelToggle() {
        document.querySelectorAll('.panel-opt').forEach((b) => {
          const on = b.dataset.panel === panel;
          b.className = `panel-opt rounded-lg py-2 text-sm font-semibold transition ${on ? 'bg-white text-indigo-brand shadow-sm' : 'text-slate-500 hover:text-slate-700'}`;
        });
      }
      paintPanelToggle();
      document.querySelectorAll('.panel-opt').forEach((b) => {
        b.addEventListener('click', () => { panel = b.dataset.panel; paintPanelToggle(); });
      });

      // Tabs
      let activeTab = 'login';
      function paintTabs() {
        document.querySelectorAll('.tab-btn').forEach((b) => {
          const on = b.dataset.tab === activeTab;
          b.className = `tab-btn border-b-2 pb-3 text-sm font-bold transition ${on ? 'border-indigo-brand text-indigo-brand' : 'border-transparent text-slate-400 hover:text-slate-600'}`;
        });
        $('#loginForm').classList.toggle('hidden', activeTab !== 'login');
        $('#registerForm').classList.toggle('hidden', activeTab !== 'register');
        hideMsg();
      }
      paintTabs();
      document.querySelectorAll('.tab-btn').forEach((b) => {
        b.addEventListener('click', () => { activeTab = b.dataset.tab; paintTabs(); });
      });

      function showMsg(text, kind) {
        const el = $('#formMsg');
        el.textContent = text;
        el.className = `mb-4 rounded-xl px-4 py-3 text-sm font-medium ${kind === 'error' ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'}`;
        el.classList.remove('hidden');
      }
      function hideMsg() { $('#formMsg').classList.add('hidden'); }

      function setLoading(form, loading) {
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = loading;
        btn.dataset.orig = btn.dataset.orig || btn.textContent;
        btn.textContent = loading ? 'Yuklanmoqda...' : btn.dataset.orig;
      }

      function goToDashboard() {
        try { localStorage.setItem('sotibber_panel', panel); } catch (e) {}
        window.location.href = `index.html?panel=${panel}`;
      }

      // Agar allaqachon login qilingan bo'lsa, to'g'ridan-to'g'ri dashboard'ga
      (async () => {
        const user = await window.SotibberAuth.getUser();
        if (user) goToDashboard();
      })();

      $('#loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMsg();
        setLoading(e.target, true);
        const { error } = await window.SotibberAuth.signIn({
          email: $('#loginEmail').value.trim(),
          password: $('#loginPassword').value,
        });
        setLoading(e.target, false);
        if (error) return showMsg(window.SotibberAuth.translateError(error), 'error');
        goToDashboard();
      });

      $('#registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMsg();
        setLoading(e.target, true);
        const { data, error } = await window.SotibberAuth.signUp({
          email: $('#regEmail').value.trim(),
          password: $('#regPassword').value,
          fullName: $('#regName').value.trim(),
          phone: $('#regPhone').value.trim(),
        });
        setLoading(e.target, false);
        if (error) return showMsg(window.SotibberAuth.translateError(error), 'error');
        if (data && data.session) {
          goToDashboard();
        } else {
          showMsg("Ro'yxatdan o'tdingiz! Emailingizga yuborilgan havola orqali hisobingizni tasdiqlang, so'ng tizimga kiring.", 'success');
          activeTab = 'login';
          paintTabs();
        }
      });
    })();
  </script>
</body>
</html>
