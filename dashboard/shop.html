<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do'kon — sotibber.uz</title>
  <meta name="description" content="sotibber.uz do'koni — mahsulotlarni ko'ring va buyurtma bering." />

  <!-- Ijtimoiy tarmoqlarda ulashganda ko'rinishi -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="sotibber.uz" />
  <meta property="og:title" content="sotibber.uz do'koni" />
  <meta property="og:description" content="Mahsulotlarni ko'ring va to'g'ridan-to'g'ri buyurtma bering." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Space Grotesk', 'Inter', 'sans-serif'] },
          colors: { violet: { brand: '#7c3aed', deep: '#4f46e5' }, ink: { 900: '#07060d', 800: '#0d0b18' }, emerald: { brand: '#059669' } },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            fadeUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
          },
          animation: { fadeIn: 'fadeIn 0.2s ease', fadeUp: 'fadeUp 0.35s ease both' },
        },
      },
    };
  </script>

  <style>
    body {
      background:
        radial-gradient(760px 460px at 50% -10%, rgba(124,58,237,.26), transparent 60%),
        radial-gradient(680px 460px at 100% 0%, rgba(99,102,241,.16), transparent 55%),
        #07060d;
      color: #e6e3f0; min-height: 100vh;
    }
    .glass { background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .btn-grad { background: linear-gradient(135deg, #7c3aed, #6d28d9 55%, #4f46e5); box-shadow: 0 12px 34px -12px rgba(124,58,237,0.7), inset 0 1px 0 rgba(255,255,255,0.22); }
    .btn-grad:hover { box-shadow: 0 16px 44px -10px rgba(124,58,237,0.9); }
    .fld { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); color: #f1f0f7; }
    .fld::placeholder { color: #6b7280; }
    .fld:focus { border-color: rgba(139,92,246,0.6); box-shadow: 0 0 0 3px rgba(124,58,237,0.18); outline: none; }
    input[type="radio"] { accent-color: #7c3aed; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body class="font-sans text-slate-200 antialiased">

  <div class="mx-auto flex min-h-screen w-full max-w-2xl flex-col">
    <!-- ===== HEADER ===== -->
    <header class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-white/5 bg-ink-900/70 px-4 backdrop-blur-xl">
      <span class="grid h-9 w-9 flex-shrink-0 place-items-center rounded-xl bg-gradient-to-br from-violet-brand to-violet-deep text-white shadow-lg shadow-violet-500/30">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
      </span>
      <div class="min-w-0 flex-1">
        <h1 id="shopName" class="truncate font-display text-base font-bold text-white">Do'kon</h1>
        <p class="truncate text-[11px] text-slate-400">sotibber.uz do'koni</p>
      </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main id="shopRoot" class="flex-1 px-4 pb-28 pt-5">
      <div class="flex h-64 items-center justify-center text-slate-500">Yuklanmoqda...</div>
    </main>
  </div>

  <!-- ===== BOTTOM NAV (app menyu) ===== -->
  <nav class="fixed inset-x-0 bottom-0 z-30 border-t border-white/10 bg-ink-900/90 pb-[env(safe-area-inset-bottom)] backdrop-blur-xl">
    <div class="mx-auto flex max-w-2xl items-stretch justify-around px-2 py-1.5">
      <button data-go="home" class="nav-tab group flex flex-1 flex-col items-center gap-1 py-1.5">
        <span class="nav-ico grid h-8 w-14 place-items-center rounded-full transition-all duration-200">
          <svg class="h-[22px] w-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
        </span>
        <span class="nav-lbl text-[11px] font-semibold transition-colors">Asosiy</span>
      </button>
      <button data-go="cart" class="nav-tab group flex flex-1 flex-col items-center gap-1 py-1.5">
        <span class="nav-ico relative grid h-8 w-14 place-items-center rounded-full transition-all duration-200">
          <svg class="h-[22px] w-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 4.6A1 1 0 005.6 19H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span id="cartBadge2" class="absolute right-2 top-0 hidden min-w-[16px] rounded-full bg-emerald-500 px-1 text-center text-[9px] font-bold leading-4 text-white ring-2 ring-ink-900"></span>
        </span>
        <span class="nav-lbl text-[11px] font-semibold transition-colors">Savatcha</span>
      </button>
      <button data-go="orders" class="nav-tab group flex flex-1 flex-col items-center gap-1 py-1.5">
        <span class="nav-ico grid h-8 w-14 place-items-center rounded-full transition-all duration-200">
          <svg class="h-[22px] w-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        </span>
        <span class="nav-lbl text-[11px] font-semibold transition-colors">Buyurtma</span>
      </button>
      <button data-go="profile" class="nav-tab group flex flex-1 flex-col items-center gap-1 py-1.5">
        <span class="nav-ico grid h-8 w-14 place-items-center rounded-full transition-all duration-200">
          <svg class="h-[22px] w-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </span>
        <span class="nav-lbl text-[11px] font-semibold transition-colors">Profil</span>
      </button>
    </div>
  </nav>

  <!-- Modal root -->
  <div id="modalRoot"></div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-24 left-1/2 z-[80] hidden -translate-x-1/2">
    <div class="glass flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-medium text-white shadow-2xl">
      <svg class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      <span id="toastMsg">Bajarildi</span>
    </div>
  </div>

  <script src="shop.js"></script>
</body>
</html>
