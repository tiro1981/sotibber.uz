<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin panel — sotibber.uz</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Space Grotesk', 'Inter', 'sans-serif'] },
          colors: { violet: { brand: '#7c3aed', deep: '#4f46e5' }, ink: { 900: '#07060d', 800: '#0d0b18' } },
        },
      },
    };
  </script>

  <style>
    body {
      position: relative;
      background:
        radial-gradient(900px 520px at 80% -12%, rgba(255,122,60,.09), transparent 60%),
        radial-gradient(760px 520px at 5% 5%, rgba(99,102,241,.12), transparent 55%),
        radial-gradient(680px 480px at 0% 100%, rgba(236,72,153,.07), transparent 55%),
        #040406;
      color: #e9e7ef; overflow-x: hidden;
    }
    /* Fluid iridescent orbs */
    .orb { position: fixed; border-radius: 50%; filter: blur(52px); opacity: .5; pointer-events: none; z-index: 0; mix-blend-mode: screen; will-change: transform, border-radius; }
    .orb-warm { background: radial-gradient(60% 60% at 32% 30%, #ffb15a 0%, #ff6a2e 38%, rgba(255,61,74,.6) 62%, transparent 78%); animation: morph 18s ease-in-out infinite; }
    .orb-cool { background: radial-gradient(60% 60% at 60% 40%, #6ea8ff 0%, #4f6bff 40%, rgba(124,58,237,.55) 66%, transparent 80%); animation: morph 22s ease-in-out infinite reverse; }
    .orb-iris { background: radial-gradient(55% 55% at 40% 45%, #37e0c8 0%, #7c9cff 35%, #d95cff 62%, transparent 80%); animation: morph 26s ease-in-out infinite; }
    @keyframes morph {
      0%,100% { border-radius: 44% 56% 62% 38% / 46% 42% 58% 54%; transform: translate(0,0) rotate(0deg) scale(1); }
      33%     { border-radius: 62% 38% 44% 56% / 58% 60% 40% 42%; transform: translate(3%, -3%) rotate(24deg) scale(1.06); }
      66%     { border-radius: 38% 62% 56% 44% / 42% 46% 54% 58%; transform: translate(-3%, 3%) rotate(-20deg) scale(.96); }
    }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none !important; } }
    body > .flex { position: relative; z-index: 1; }
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .btn-grad {
      background: linear-gradient(135deg, #ff8a3d 0%, #ff4d6a 48%, #8b5cf6 100%);
      box-shadow: 0 12px 34px -10px rgba(255,90,80,0.55), inset 0 1px 0 rgba(255,255,255,0.24);
    }
    .nav-link { transition: background .2s, color .2s; }
    .nav-link.active { background: linear-gradient(135deg, rgba(255,138,80,.28), rgba(139,92,246,.24)); color:#fff; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body class="min-h-screen font-sans text-slate-200 antialiased">

  <!-- Fluid iridescent orbs (fon) -->
  <div class="orb orb-warm right-[-80px] top-[-60px] h-[360px] w-[440px]"></div>
  <div class="orb orb-cool left-[12%] top-[45%] h-[300px] w-[360px]"></div>
  <div class="orb orb-iris right-[8%] bottom-[-80px] h-[340px] w-[420px]"></div>

  <div class="flex min-h-screen">
    <!-- ================= SIDEBAR ================= -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-white/5 bg-ink-900/80 backdrop-blur-xl transition-transform duration-300 lg:translate-x-0">
      <div class="flex h-16 items-center gap-2 border-b border-white/5 px-6">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-violet-brand to-violet-deep text-white shadow-lg shadow-violet-500/30">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/></svg>
        </span>
        <span class="font-display text-lg font-bold text-white">sotibber<span class="text-violet-400">.uz</span></span>
      </div>
      <div class="px-6 pt-5">
        <p class="text-[11px] font-bold uppercase tracking-wider text-violet-300">Admin panel</p>
      </div>
      <nav class="flex-1 space-y-1 px-3 py-4">
        <button data-view="stats" class="nav-link active flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M9 17V9m4 8V5m4 12v-6"/></svg>
          Statistika
        </button>
        <button data-view="products" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          Mahsulotlar
          <span id="pendingBadge" class="ml-auto hidden rounded-full bg-amber-500/20 px-2 py-0.5 text-[11px] font-bold text-amber-300"></span>
        </button>
        <button data-view="users" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4z"/></svg>
          Foydalanuvchilar
        </button>
        <button data-view="chat" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4-.8L3 20l.8-4.2A7.9 7.9 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          Savol-javob chat
          <span id="chatBadge" class="ml-auto hidden rounded-full bg-rose-500/25 px-2 py-0.5 text-[11px] font-bold text-rose-200"></span>
        </button>
        <button data-view="notifications" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          Bildirishnoma
        </button>
        <button data-view="settings" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
          Messenjer
        </button>
      </nav>
      <div class="border-t border-white/5 p-3">
        <button id="logoutBtn" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-rose-300 hover:bg-rose-500/10">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Chiqish
        </button>
      </div>
    </aside>

    <!-- overlay for mobile -->
    <div id="overlay" class="fixed inset-0 z-30 hidden bg-black/60 lg:hidden"></div>

    <!-- ================= MAIN ================= -->
    <div class="flex min-w-0 flex-1 flex-col lg:pl-64">
      <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-white/5 bg-ink-900/70 px-4 backdrop-blur-xl sm:px-6">
        <button id="openSidebar" class="grid h-10 w-10 place-items-center rounded-xl text-slate-300 hover:bg-white/10 lg:hidden" aria-label="Menyu">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 id="viewTitle" class="min-w-0 flex-1 truncate font-display text-base font-bold text-white sm:text-lg">Statistika</h1>
        <button id="refreshBtn" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs font-semibold text-slate-200 hover:bg-white/10">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Yangilash
        </button>
        <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-sm font-bold text-white">A</span>
      </header>

      <main id="viewRoot" class="flex-1 p-4 sm:p-6 lg:p-8">
        <div class="flex h-64 items-center justify-center text-slate-500">Yuklanmoqda...</div>
      </main>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[60] hidden -translate-x-1/2">
    <div class="glass flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-medium text-white shadow-2xl">
      <svg class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      <span id="toastMsg">Bajarildi</span>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    /* ---- Maxfiy admin himoyasi: bayroq bo'lmasa loginga qaytaramiz ---- */
    if (sessionStorage.getItem('sotibber_admin') !== '1') {
      window.location.replace('login.html');
      return;
    }

    const $ = (s) => document.querySelector(s);
    const sb = window.sb;
    const uzs = (n) => (Number(n) || 0).toLocaleString('ru-RU').replace(/,/g, ' ');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let PRODUCTS = [];
    let PROFILES = [];
    let CHAT = [];
    let SETTINGS = {};
    let NOTIFS = [];
    let chatSelectedUser = null;
    let currentView = 'stats';

    /* ---------------- Toast ---------------- */
    function toast(msg) {
      $('#toastMsg').textContent = msg;
      const t = $('#toast');
      t.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    /* ---------------- Sidebar (mobile) ---------------- */
    const sidebar = $('#sidebar'), overlay = $('#overlay');
    function openSb() { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
    function closeSb() { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
    $('#openSidebar').addEventListener('click', openSb);
    overlay.addEventListener('click', closeSb);

    /* ---------------- Chiqish ---------------- */
    $('#logoutBtn').addEventListener('click', () => {
      try { sessionStorage.removeItem('sotibber_admin'); } catch (e) {}
      window.location.replace('login.html');
    });

    /* ---------------- Status badge ---------------- */
    function badge(status) {
      const map = {
        'Moderatsiyada': 'bg-amber-500/15 text-amber-300 ring-amber-500/30',
        'Faol': 'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30',
        'Sotuvda': 'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30',
        'Rad etilgan': 'bg-rose-500/15 text-rose-300 ring-rose-500/30',
        'Tugadi': 'bg-slate-500/15 text-slate-300 ring-slate-500/30',
      };
      const cls = map[status] || 'bg-slate-500/15 text-slate-300 ring-slate-500/30';
      return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1 ${cls}">${esc(status)}</span>`;
    }

    /* ---------------- Ma'lumot yuklash ---------------- */
    async function loadData() {
      let loadError = false;
      try {
        const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        PRODUCTS = data || [];
      } catch (e) { console.error('Mahsulotlar:', e); PRODUCTS = []; loadError = true; }

      try {
        const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        PROFILES = data || [];
      } catch (e) { console.error('Foydalanuvchilar:', e); PROFILES = []; }

      try {
        const { data, error } = await sb.from('support_messages').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        CHAT = data || [];
      } catch (e) { console.error('Chat:', e); CHAT = []; }

      try {
        const { data, error } = await sb.from('site_settings').select('*');
        if (error) throw error;
        SETTINGS = {};
        (data || []).forEach((r) => { SETTINGS[r.key] = r.value || ''; });
      } catch (e) { console.error('Sozlamalar:', e); SETTINGS = {}; }

      try {
        const { data, error } = await sb.from('notifications').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        NOTIFS = data || [];
      } catch (e) { console.error('Bildirishnomalar:', e); NOTIFS = []; }

      const pending = PRODUCTS.filter((p) => p.status === 'Moderatsiyada').length;
      const badgeEl = $('#pendingBadge');
      if (pending > 0) { badgeEl.textContent = pending; badgeEl.classList.remove('hidden'); }
      else badgeEl.classList.add('hidden');

      // Chat: admin o'qimagan (foydalanuvchidan kelgan) xabarlar soni
      const unread = CHAT.filter((m) => m.sender === 'user' && !m.read_by_admin).length;
      const chatBadgeEl = $('#chatBadge');
      if (unread > 0) { chatBadgeEl.textContent = unread; chatBadgeEl.classList.remove('hidden'); }
      else chatBadgeEl.classList.add('hidden');

      window.__ADMIN_LOAD_ERROR = loadError;
      render();
    }

    /* ---------------- Empty-state / RLS ogohlantirishi ---------------- */
    function policyHint() {
      return `
        <div class="glass mt-4 rounded-2xl p-5 text-sm">
          <p class="font-semibold text-amber-300">Ma'lumot ko'rinmayaptimi?</p>
          <p class="mt-1 text-slate-400">Admin panel Supabase'dagi <b>anon</b> kalit orqali o'qiydi. Barcha mahsulot va
          foydalanuvchilarni ko'rish uchun Supabase'da tegishli <b>RLS siyosatlari</b> qo'shilishi kerak
          (loyihadagi <code class="rounded bg-white/10 px-1">supabase_schema.sql</code> faylining oxiridagi "ADMIN" bo'limiga qarang).</p>
        </div>`;
    }

    /* ---------------- Ko'rinishlar ---------------- */
    function renderStats() {
      const totalUsers = PROFILES.length;
      const totalProducts = PRODUCTS.length;
      const pending = PRODUCTS.filter((p) => p.status === 'Moderatsiyada').length;
      const active = PRODUCTS.filter((p) => p.status === 'Faol' || p.status === 'Sotuvda').length;
      const inventoryValue = PRODUCTS.reduce((s, p) => s + (Number(p.price) || 0) * (Number(p.stock) || 0), 0);

      const card = (label, value, sub, svg, tint) => `
        <div class="glass rounded-2xl p-5">
          <div class="flex items-center justify-between">
            <p class="text-sm text-slate-400">${label}</p>
            <span class="grid h-9 w-9 place-items-center rounded-xl ${tint}">${svg}</span>
          </div>
          <p class="font-display mt-3 text-3xl font-bold text-white">${value}</p>
          <p class="mt-1 text-xs text-slate-500">${sub}</p>
        </div>`;

      $('#viewRoot').innerHTML = `
        <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
          ${card('Foydalanuvchilar', totalUsers, 'Ro\'yxatdan o\'tganlar', '<svg class="h-5 w-5 text-violet-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4z"/></svg>', 'bg-violet-500/15')}
          ${card('Mahsulotlar', totalProducts, 'Jami yuklangan', '<svg class="h-5 w-5 text-indigo-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7"/></svg>', 'bg-indigo-500/15')}
          ${card('Moderatsiyada', pending, 'Tasdiq kutmoqda', '<svg class="h-5 w-5 text-amber-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>', 'bg-amber-500/15')}
          ${card('Sklad qiymati', uzs(inventoryValue) + ' <span class=\'text-base text-slate-500\'>so\'m</span>', active + ' ta faol mahsulot', '<svg class="h-5 w-5 text-emerald-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V6m0 12v-2"/></svg>', 'bg-emerald-500/15')}
        </div>

        <div class="glass mt-5 rounded-2xl p-5">
          <h3 class="font-display text-base font-bold text-white">So'nggi mahsulotlar</h3>
          <div class="mt-3 space-y-2">
            ${PRODUCTS.slice(0, 5).map((p) => `
              <div class="flex items-center justify-between rounded-xl bg-white/5 px-4 py-3">
                <span class="truncate text-sm font-medium text-slate-200">${esc(p.name)}</span>
                <div class="flex items-center gap-3">
                  <span class="text-sm font-semibold text-emerald-300">${uzs(p.price)} so'm</span>
                  ${badge(p.status)}
                </div>
              </div>`).join('') || '<p class="text-sm text-slate-500">Hozircha mahsulot yo\'q.</p>'}
          </div>
        </div>
        ${(PRODUCTS.length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;
    }

    function renderProducts() {
      const rows = PRODUCTS.map((p) => {
        const owner = PROFILES.find((u) => u.id === p.seller_id);
        const ownerName = owner ? (owner.full_name || owner.phone || owner.id.slice(0, 8)) : (p.seller_id ? p.seller_id.slice(0, 8) : '—');
        const isPending = p.status === 'Moderatsiyada';
        return `
          <tr class="border-b border-white/5">
            <td class="px-4 py-3">
              <div class="flex items-center gap-3">
                <span class="grid h-9 w-9 shrink-0 place-items-center overflow-hidden rounded-lg bg-white/5">
                  ${p.image_url ? `<img src="${esc(p.image_url)}" class="h-full w-full object-cover" alt="" />` : '<svg class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14M4 6h16v12H4z"/></svg>'}
                </span>
                <span class="text-sm font-medium text-slate-100">${esc(p.name)}</span>
              </div>
            </td>
            <td class="px-4 py-3 text-sm text-slate-400">${esc(ownerName)}</td>
            <td class="px-4 py-3 text-sm font-semibold text-emerald-300">${uzs(p.price)}</td>
            <td class="px-4 py-3 text-sm text-slate-300">${esc(p.stock)}</td>
            <td class="px-4 py-3 text-sm text-slate-300">${esc(p.commission)}%</td>
            <td class="px-4 py-3">${badge(p.status)}</td>
            <td class="px-4 py-3">
              <div class="flex justify-end gap-2">
                ${isPending ? `
                  <button data-approve="${p.id}" class="rounded-lg bg-emerald-500/15 px-3 py-1.5 text-xs font-semibold text-emerald-300 ring-1 ring-emerald-500/30 hover:bg-emerald-500/25">Tasdiqlash</button>
                  <button data-reject="${p.id}" class="rounded-lg bg-rose-500/15 px-3 py-1.5 text-xs font-semibold text-rose-300 ring-1 ring-rose-500/30 hover:bg-rose-500/25">Rad etish</button>
                ` : `

    /* ---------------- Chat (savol-javob) ---------------- */
    function userName(uid) {
      const u = PROFILES.find((p) => p.id === uid);
      return u ? (u.full_name || u.phone || uid.slice(0, 8)) : (uid ? uid.slice(0, 8) : '—');
    }
    function timeStr(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function renderChat() {
      // Suhbatlarni foydalanuvchi bo'yicha guruhlaymiz
      const byUser = {};
      CHAT.forEach((m) => {
        (byUser[m.user_id] = byUser[m.user_id] || []).push(m);
      });
      const convos = Object.keys(byUser).map((uid) => {
        const msgs = byUser[uid];
        const last = msgs[msgs.length - 1];
        const unread = msgs.filter((m) => m.sender === 'user' && !m.read_by_admin).length;
        return { uid, msgs, last, unread };
      }).sort((a, b) => new Date(b.last.created_at) - new Date(a.last.created_at));

      // Tanlangan suhbat topilmasa, birinchisini olamiz
      if (chatSelectedUser && !byUser[chatSelectedUser]) chatSelectedUser = null;
      if (!chatSelectedUser && convos.length) chatSelectedUser = convos[0].uid;

      const listHtml = convos.map((c) => {
        const active = c.uid === chatSelectedUser;
        return `
          <button data-open-convo="${c.uid}" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition ${active ? 'bg-violet-500/15 ring-1 ring-violet-400/40' : 'hover:bg-white/5'}">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-xs font-bold text-white">${esc(userName(c.uid).slice(0, 1).toUpperCase())}</span>
            <span class="min-w-0 flex-1">
              <span class="flex items-center justify-between gap-2">
                <span class="truncate text-sm font-semibold text-white">${esc(userName(c.uid))}</span>
                ${c.unread ? `<span class="shrink-0 rounded-full bg-rose-500/25 px-1.5 text-[10px] font-bold text-rose-200">${c.unread}</span>` : ''}
              </span>
              <span class="block truncate text-xs text-slate-400">${c.last.sender === 'admin' ? 'Siz: ' : ''}${esc(c.last.body)}</span>
            </span>
          </button>`;
      }).join('') || '<p class="px-3 py-6 text-center text-sm text-slate-500">Hozircha savollar yo\'q.</p>';

      const sel = chatSelectedUser ? byUser[chatSelectedUser] : null;
      const threadHtml = sel ? sel.map((m) => {
        const mine = m.sender === 'admin';
        return `
          <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[78%] rounded-2xl px-3.5 py-2 text-sm ${mine ? 'bg-gradient-to-br from-violet-brand to-violet-deep text-white' : 'bg-white/8 text-slate-100 ring-1 ring-white/10'}">
              <p class="whitespace-pre-wrap break-words">${esc(m.body)}</p>
              <p class="mt-1 text-[10px] ${mine ? 'text-white/60' : 'text-slate-400'}">${timeStr(m.created_at)}</p>
            </div>
          </div>`;
      }).join('') : '';

      $('#viewRoot').innerHTML = `
        <div class="grid gap-4 lg:grid-cols-[300px_1fr]">
          <!-- Suhbatlar ro'yxati -->
          <div class="glass rounded-2xl p-2 lg:max-h-[calc(100vh-11rem)] lg:overflow-y-auto">
            ${listHtml}
          </div>
          <!-- Tanlangan suhbat -->
          <div class="glass flex flex-col rounded-2xl lg:h-[calc(100vh-11rem)]">
            ${sel ? `
              <div class="flex items-center gap-3 border-b border-white/10 px-4 py-3">
                <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-xs font-bold text-white">${esc(userName(chatSelectedUser).slice(0, 1).toUpperCase())}</span>
                <div>
                  <p class="text-sm font-semibold text-white">${esc(userName(chatSelectedUser))}</p>
                  <p class="text-[11px] text-slate-500">Foydalanuvchi bilan suhbat</p>
                </div>
              </div>
              <div id="chatThread" class="flex-1 space-y-2.5 overflow-y-auto p-4">${threadHtml}</div>
              <form id="chatReplyForm" class="flex items-center gap-2 border-t border-white/10 p-3">
                <input id="chatReplyInput" type="text" autocomplete="off" placeholder="Javob yozing..." class="flex-1 rounded-xl bg-white/5 px-3.5 py-2.5 text-sm text-slate-100 outline-none ring-1 ring-white/10 placeholder:text-slate-500 focus:ring-violet-400/50" />
                <button type="submit" class="btn-grad grid h-10 w-10 shrink-0 place-items-center rounded-xl text-white">
                  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
              </form>
            ` : `
              <div class="flex flex-1 items-center justify-center p-10 text-center text-sm text-slate-500">
                Chapdan suhbatni tanlang yoki hozircha savol yo'q.
              </div>
            `}
          </div>
        </div>
        ${(CHAT.length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;

      // Threadni pastga scroll qilamiz
      const thread = $('#chatThread');
      if (thread) thread.scrollTop = thread.scrollHeight;

      // Ochilgan suhbatdagi o'qilmagan xabarlarni "o'qildi" deb belgilaymiz
      markConvoRead(chatSelectedUser);
    }

    async function markConvoRead(uid) {
      if (!uid) return;
      const unreadIds = CHAT.filter((m) => m.user_id === uid && m.sender === 'user' && !m.read_by_admin).map((m) => m.id);
      if (!unreadIds.length) return;
      CHAT.forEach((m) => { if (unreadIds.includes(m.id)) m.read_by_admin = true; });
      const unread = CHAT.filter((m) => m.sender === 'user' && !m.read_by_admin).length;
      const chatBadgeEl = $('#chatBadge');
      if (unread > 0) { chatBadgeEl.textContent = unread; chatBadgeEl.classList.remove('hidden'); }
      else chatBadgeEl.classList.add('hidden');
      try { await sb.from('support_messages').update({ read_by_admin: true }).in('id', unreadIds); } catch (e) { console.error(e); }
    }

    async function sendReply(body) {
      if (!chatSelectedUser || !body.trim()) return;
      const text = body.trim();
      const { data, error } = await sb.from('support_messages')
        .insert({ user_id: chatSelectedUser, sender: 'admin', body: text, read_by_admin: true })
        .select().single();
      if (error) { console.error(error); toast('Xatolik: javob yuborilmadi'); return; }
      CHAT.push(data);
      renderChat();
    }

    /* ---------------- Sozlamalar (messenjer havolalari) ---------------- */
    const SOCIALS = [
      { key: 'telegram', label: 'Telegram', ph: 'https://t.me/kanal_nomi', tint: 'text-sky-300 bg-sky-500/15',
        icon: '<path d="M21.9 4.3 18.5 20c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.7 13.6 1.9 12c-1-.3-1-1 .2-1.5l18.2-7c.9-.3 1.6.2 1.6 1.8Z"/>' },
      { key: 'instagram', label: 'Instagram', ph: 'https://instagram.com/profil', tint: 'text-pink-300 bg-pink-500/15',
        icon: '<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2"/>' },
      { key: 'youtube', label: 'YouTube', ph: 'https://youtube.com/@kanal', tint: 'text-red-300 bg-red-500/15',
        icon: '<path d="M23 12s0-3.5-.4-5.2c-.3-1-1-1.7-2-2C18.9 4.5 12 4.5 12 4.5s-6.9 0-8.6.3c-1 .3-1.7 1-2 2C1 8.5 1 12 1 12s0 3.5.4 5.2c.3 1 1 1.7 2 2 1.7.3 8.6.3 8.6.3s6.9 0 8.6-.3c1-.3 1.7-1 2-2 .4-1.7.4-5.2.4-5.2ZM9.8 15.3V8.7l5.7 3.3-5.7 3.3Z"/>' },
    ];

    function renderSettings() {
      const rows = SOCIALS.map((s) => `
        <label class="block">
          <span class="mb-1.5 flex items-center gap-2 text-sm font-semibold text-slate-200">
            <span class="grid h-7 w-7 place-items-center rounded-lg ${s.tint}"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">${s.icon}</svg></span>
            ${s.label}
          </span>
          <input type="url" data-setting="${s.key}" value="${esc(SETTINGS[s.key] || '')}" placeholder="${s.ph}"
            class="w-full rounded-xl bg-white/5 px-3.5 py-2.5 text-sm text-slate-100 outline-none ring-1 ring-white/10 placeholder:text-slate-500 focus:ring-violet-400/50" />
        </label>`).join('');

      $('#viewRoot').innerHTML = `
        <div class="mx-auto max-w-2xl">
          <div class="glass rounded-2xl p-6">
            <h3 class="font-display text-lg font-bold text-white">Messenjer havolalari</h3>
            <p class="mt-1 text-sm text-slate-400">Bu havolalar saytning pastki qismidagi (footer) tugmalarga qo'yiladi. Bo'sh qoldirilsa, tugma bosilmaydi.</p>
            <form id="settingsForm" class="mt-6 space-y-5">
              ${rows}
              <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="btn-grad rounded-xl px-6 py-2.5 text-sm font-bold text-white">Saqlash</button>
                <span id="settingsSaved" class="hidden text-sm font-medium text-emerald-300">Saqlandi ✓</span>
              </div>
            </form>
          </div>
        </div>
        ${(Object.keys(SETTINGS).length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;
    }

    async function saveSettings(form) {
      const rows = SOCIALS.map((s) => ({
        key: s.key,
        value: (form.querySelector(`[data-setting="${s.key}"]`).value || '').trim(),
        updated_at: new Date().toISOString(),
      }));
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
      const { error } = await sb.from('site_settings').upsert(rows, { onConflict: 'key' });
      btn.disabled = false; btn.textContent = 'Saqlash';
      if (error) {
        console.error(error);
        const missing = error.code === 'PGRST205' || /schema cache|does not exist|find the table/i.test(error.message || '');
        toast(missing
          ? "Jadval topilmadi — avval Supabase'da supabase_schema.sql'ni ishga tushiring"
          : 'Xatolik: ' + (error.message || 'saqlab bo\'lmadi'));
        return;
      }
      rows.forEach((r) => { SETTINGS[r.key] = r.value; });
      const ok = $('#settingsSaved');
      ok.classList.remove('hidden');
      setTimeout(() => ok.classList.add('hidden'), 2500);
      toast('Sozlamalar saqlandi ✓');
    }

    /* ---------------- Bildirishnomalar ---------------- */
    const AUDIENCE = { all: 'Barchaga', seller: 'Sotuvchilarga', affiliate: 'Sotib beruvchilarga' };
    function renderNotifications() {
      const sent = NOTIFS.map((n) => `
        <div class="glass flex items-start justify-between gap-3 rounded-xl p-4">
          <div class="min-w-0">
            <div class="mb-1 flex items-center gap-2">
              <span class="rounded-full bg-violet-500/15 px-2.5 py-0.5 text-[11px] font-bold text-violet-300">${esc(AUDIENCE[n.audience] || n.audience)}</span>
              <span class="text-[11px] text-slate-500">${n.created_at ? new Date(n.created_at).toLocaleString('ru-RU') : ''}</span>
            </div>
            ${n.title ? `<p class="text-sm font-semibold text-white">${esc(n.title)}</p>` : ''}
            <p class="whitespace-pre-wrap break-words text-sm text-slate-300">${esc(n.body)}</p>
          </div>
          <button data-del-notif="${n.id}" class="flex-shrink-0 rounded-lg bg-rose-500/15 px-3 py-1.5 text-xs font-semibold text-rose-300 ring-1 ring-rose-500/30 hover:bg-rose-500/25">O'chirish</button>
        </div>`).join('') || '<p class="text-sm text-slate-500">Hozircha bildirishnoma yuborilmagan.</p>';

      $('#viewRoot').innerHTML = `
        <div class="mx-auto max-w-2xl space-y-5">
          <div class="glass rounded-2xl p-6">
            <h3 class="font-display text-lg font-bold text-white">Yangi bildirishnoma</h3>
            <p class="mt-1 text-sm text-slate-400">Foydalanuvchilarga xabar yuboring — ular qo'ng'iroq belgisida ko'radi.</p>
            <form id="notifForm" class="mt-5 space-y-4">
              <label class="block">
                <span class="mb-1.5 block text-sm font-semibold text-slate-200">Kimga</span>
                <select id="notifAudience" class="w-full rounded-xl bg-white/5 px-3.5 py-2.5 text-sm text-slate-100 outline-none ring-1 ring-white/10 focus:ring-violet-400/50">
                  <option value="all" class="bg-ink-800">Barchaga</option>
                  <option value="seller" class="bg-ink-800">Faqat sotuvchilarga</option>
                  <option value="affiliate" class="bg-ink-800">Faqat sotib beruvchilarga</option>
                </select>
              </label>
              <label class="block">
                <span class="mb-1.5 block text-sm font-semibold text-slate-200">Sarlavha <span class="font-normal text-slate-500">(ixtiyoriy)</span></span>
                <input id="notifTitle" type="text" placeholder="Masalan: Yangilik" class="w-full rounded-xl bg-white/5 px-3.5 py-2.5 text-sm text-slate-100 outline-none ring-1 ring-white/10 placeholder:text-slate-500 focus:ring-violet-400/50" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-sm font-semibold text-slate-200">Matn</span>
                <textarea id="notifBody" rows="3" required placeholder="Bildirishnoma matni..." class="w-full resize-none rounded-xl bg-white/5 px-3.5 py-2.5 text-sm text-slate-100 outline-none ring-1 ring-white/10 placeholder:text-slate-500 focus:ring-violet-400/50"></textarea>
              </label>
              <button type="submit" class="btn-grad rounded-xl px-6 py-2.5 text-sm font-bold text-white">Yuborish</button>
            </form>
          </div>
          <div>
            <h3 class="font-display mb-3 text-base font-bold text-white">Yuborilgan bildirishnomalar</h3>
            <div class="space-y-2">${sent}</div>
          </div>
        </div>
        ${(NOTIFS.length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;
    }

    async function sendNotification(form) {
      const audience = form.querySelector('#notifAudience').value;
      const title = form.querySelector('#notifTitle').value.trim();
      const body = form.querySelector('#notifBody').value.trim();
      if (!body) { toast('Matn kiriting'); return; }
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Yuborilmoqda...';
      const { data, error } = await sb.from('notifications').insert({ audience, title: title || null, body }).select().single();
      btn.disabled = false; btn.textContent = 'Yuborish';
      if (error) {
        console.error(error);
        const missing = /notifications|does not exist|schema cache|find the table/i.test(error.message || '');
        toast(missing ? "Jadval topilmadi — supabase_qoshimcha.sql'ni ishga tushiring" : 'Xatolik: ' + (error.message || 'yuborilmadi'));
        return;
      }
      NOTIFS.unshift(data);
      renderNotifications();
      toast('Bildirishnoma yuborildi ✓');
    }

    async function deleteNotification(id) {
      if (!confirm('Bildirishnomani o\'chirasizmi?')) return;
      const { error } = await sb.from('notifications').delete().eq('id', id);
      if (error) { console.error(error); toast('Xatolik: o\'chirib bo\'lmadi'); return; }
      NOTIFS = NOTIFS.filter((n) => n.id !== id);
      renderNotifications();
      toast('O\'chirildi');
    }

    function render() {
      const titles = { stats: 'Statistika', products: 'Mahsulotlar', users: 'Foydalanuvchilar', chat: 'Savol-javob chat', notifications: 'Bildirishnomalar', settings: 'Messenjer' };
      $('#viewTitle').textContent = titles[currentView] || 'Admin';
      if (currentView === 'stats') renderStats();
      else if (currentView === 'products') renderProducts();
      else if (currentView === 'users') renderUsers();
      else if (currentView === 'chat') renderChat();
      else if (currentView === 'notifications') renderNotifications();
      else if (currentView === 'settings') renderSettings();
    }

    /* ---------------- Moderatsiya amallari ---------------- */
    async function setStatus(id, status) {
      const { error } = await sb.from('products').update({ status }).eq('id', id);
      if (error) { console.error(error); toast('Xatolik: ' + (error.message || 'yangilab bo\'lmadi')); return; }
      const p = PRODUCTS.find((x) => x.id === id);
      if (p) p.status = status;
      toast(status === 'Faol' ? 'Mahsulot tasdiqlandi ✓' : 'Mahsulot rad etildi');
      loadData();
    }

    async function removeProduct(id) {
      if (!confirm('Mahsulotni o\'chirishni tasdiqlaysizmi?')) return;
      const { error } = await sb.from('products').delete().eq('id', id);
      if (error) { console.error(error); toast('Xatolik: ' + (error.message || 'o\'chirib bo\'lmadi')); return; }
      toast('Mahsulot o\'chirildi');
      loadData();
    }

    /* ---------------- Hodisalarni delegatsiya qilish ---------------- */
    $('#viewRoot').addEventListener('click', (e) => {
      const ap = e.target.closest('[data-approve]');
      const rj = e.target.closest('[data-reject]');
      const dl = e.target.closest('[data-delete]');
      const cv = e.target.closest('[data-open-convo]');
      const dn = e.target.closest('[data-del-notif]');
      if (ap) setStatus(ap.dataset.approve, 'Faol');
      else if (rj) setStatus(rj.dataset.reject, 'Rad etilgan');
      else if (dl) removeProduct(dl.dataset.delete);
      else if (cv) { chatSelectedUser = cv.dataset.openConvo; renderChat(); }
      else if (dn) deleteNotification(dn.dataset.delNotif);
    });

    // Formalar (delegatsiya orqali): chat javobi va sozlamalar
    $('#viewRoot').addEventListener('submit', (e) => {
      const chatForm = e.target.closest('#chatReplyForm');
      const settingsForm = e.target.closest('#settingsForm');
      const notifForm = e.target.closest('#notifForm');
      if (chatForm) {
        e.preventDefault();
        const input = chatForm.querySelector('#chatReplyInput');
        const val = input.value;
        input.value = '';
        sendReply(val);
      } else if (settingsForm) {
        e.preventDefault();
        saveSettings(settingsForm);
      } else if (notifForm) {
        e.preventDefault();
        sendNotification(notifForm);
      }
    });

    document.querySelectorAll('.nav-link').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentView = btn.dataset.view;
        document.querySelectorAll('.nav-link').forEach((b) => b.classList.toggle('active', b === btn));
        closeSb();
        render();
      });
    });

    $('#refreshBtn').addEventListener('click', () => { toast('Yangilanmoqda...'); loadData(); });

    /* ---------------- Boshlash ---------------- */
    if (!sb) {
