<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin panel — sotibber.uz</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Space Grotesk', 'Inter', 'sans-serif'] },
          colors: { violet: { brand: '#7c3aed', deep: '#4f46e5' }, ink: { 900: '#07060d', 800: '#0d0b18' } },
        },
      },
    };
  </script>

  <style>
    body {
      position: relative;
      background:
        radial-gradient(900px 520px at 80% -12%, rgba(255,122,60,.09), transparent 60%),
        radial-gradient(760px 520px at 5% 5%, rgba(99,102,241,.12), transparent 55%),
        radial-gradient(680px 480px at 0% 100%, rgba(236,72,153,.07), transparent 55%),
        #040406;
      color: #e9e7ef; overflow-x: hidden;
    }
    /* Fluid iridescent orbs */
    .orb { position: fixed; border-radius: 50%; filter: blur(52px); opacity: .5; pointer-events: none; z-index: 0; mix-blend-mode: screen; will-change: transform, border-radius; }
    .orb-warm { background: radial-gradient(60% 60% at 32% 30%, #ffb15a 0%, #ff6a2e 38%, rgba(255,61,74,.6) 62%, transparent 78%); animation: morph 18s ease-in-out infinite; }
    .orb-cool { background: radial-gradient(60% 60% at 60% 40%, #6ea8ff 0%, #4f6bff 40%, rgba(124,58,237,.55) 66%, transparent 80%); animation: morph 22s ease-in-out infinite reverse; }
    .orb-iris { background: radial-gradient(55% 55% at 40% 45%, #37e0c8 0%, #7c9cff 35%, #d95cff 62%, transparent 80%); animation: morph 26s ease-in-out infinite; }
    @keyframes morph {
      0%,100% { border-radius: 44% 56% 62% 38% / 46% 42% 58% 54%; transform: translate(0,0) rotate(0deg) scale(1); }
      33%     { border-radius: 62% 38% 44% 56% / 58% 60% 40% 42%; transform: translate(3%, -3%) rotate(24deg) scale(1.06); }
      66%     { border-radius: 38% 62% 56% 44% / 42% 46% 54% 58%; transform: translate(-3%, 3%) rotate(-20deg) scale(.96); }
    }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none !important; } }
    body > .flex { position: relative; z-index: 1; }
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .btn-grad {
      background: linear-gradient(135deg, #ff8a3d 0%, #ff4d6a 48%, #8b5cf6 100%);
      box-shadow: 0 12px 34px -10px rgba(255,90,80,0.55), inset 0 1px 0 rgba(255,255,255,0.24);
    }
    .nav-link { transition: background .2s, color .2s; }
    .nav-link.active { background: linear-gradient(135deg, rgba(255,138,80,.28), rgba(139,92,246,.24)); color:#fff; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body class="min-h-screen font-sans text-slate-200 antialiased">

  <!-- Fluid iridescent orbs (fon) -->
  <div class="orb orb-warm right-[-80px] top-[-60px] h-[360px] w-[440px]"></div>
  <div class="orb orb-cool left-[12%] top-[45%] h-[300px] w-[360px]"></div>
  <div class="orb orb-iris right-[8%] bottom-[-80px] h-[340px] w-[420px]"></div>

  <div class="flex min-h-screen">
    <!-- ================= SIDEBAR ================= -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-white/5 bg-ink-900/80 backdrop-blur-xl transition-transform duration-300 lg:translate-x-0">
      <div class="flex h-16 items-center gap-2 border-b border-white/5 px-6">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-violet-brand to-violet-deep text-white shadow-lg shadow-violet-500/30">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/></svg>
        </span>
        <span class="font-display text-lg font-bold text-white">sotibber<span class="text-violet-400">.uz</span></span>
      </div>
      <div class="px-6 pt-5">
        <p class="text-[11px] font-bold uppercase tracking-wider text-violet-300">Admin panel</p>
      </div>
      <nav class="flex-1 space-y-1 px-3 py-4">
        <button data-view="stats" class="nav-link active flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M9 17V9m4 8V5m4 12v-6"/></svg>
          Statistika
        </button>
        <button data-view="products" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          Mahsulotlar
          <span id="pendingBadge" class="ml-auto hidden rounded-full bg-amber-500/20 px-2 py-0.5 text-[11px] font-bold text-amber-300"></span>
        </button>
        <button data-view="users" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4z"/></svg>
          Foydalanuvchilar
        </button>
        <button data-view="account" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 10a2 2 0 012-2h14a2 2 0 012 2m-18 0v8a2 2 0 002 2h14a2 2 0 002-2v-8M7 15h4"/></svg>
          Hisob
        </button>
        <button data-view="chat" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4-.8L3 20l.8-4.2A7.9 7.9 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          Savol-javob chat
          <span id="chatBadge" class="ml-auto hidden rounded-full bg-rose-500/25 px-2 py-0.5 text-[11px] font-bold text-rose-200"></span>
        </button>
        <button data-view="notifications" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          Bildirishnoma
        </button>
        <button data-view="settings" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
          Messenjer
        </button>
      </nav>
      <div class="border-t border-white/5 p-3">
        <button id="logoutBtn" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-rose-300 hover:bg-rose-500/10">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Chiqish
        </button>
      </div>
    </aside>

    <!-- overlay for mobile -->
    <div id="overlay" class="fixed inset-0 z-30 hidden bg-black/60 lg:hidden"></div>

    <!-- ================= MAIN ================= -->
    <div class="flex min-w-0 flex-1 flex-col lg:pl-64">
      <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-white/5 bg-ink-900/70 px-4 backdrop-blur-xl sm:px-6">
        <button id="openSidebar" class="grid h-10 w-10 place-items-center rounded-xl text-slate-300 hover:bg-white/10 lg:hidden" aria-label="Menyu">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 id="viewTitle" class="min-w-0 flex-1 truncate font-display text-base font-bold text-white sm:text-lg">Statistika</h1>
        <button id="refreshBtn" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs font-semibold text-slate-200 hover:bg-white/10">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Yangilash
        </button>
        <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-sm font-bold text-white">A</span>
      </header>

      <main id="viewRoot" class="flex-1 p-4 sm:p-6 lg:p-8">
        <div class="flex h-64 items-center justify-center text-slate-500">Yuklanmoqda...</div>
      </main>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[60] hidden -translate-x-1/2">
    <div class="glass flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-medium text-white shadow-2xl">
      <svg class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      <span id="toastMsg">Bajarildi</span>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    /* ---- Maxfiy admin himoyasi: bayroq bo'lmasa loginga qaytaramiz ---- */
    if (sessionStorage.getItem('sotibber_admin') !== '1') {
      window.location.replace('login.html');
      return;
    }

    const $ = (s) => document.querySelector(s);
    const sb = window.sb;
    const uzs = (n) => (Number(n) || 0).toLocaleString('ru-RU').replace(/,/g, ' ');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let PRODUCTS = [];
    let PROFILES = [];
    let ORDERS = [];
    let AFF_PRODUCTS = [];
    let CHAT = [];
    let SETTINGS = {};
    let NOTIFS = [];
    let chatSelectedUser = null;
    let currentView = 'stats';
    let userQuery = '';
    // Chat filtri / muhim / arxiv (localStorage'da saqlanadi)
    let chatFilter = 'all';       // all | day | week | month
    let chatShowArchived = false;
    let chatStarredOnly = false;
    let chatArchived = new Set();
    let chatStarred = new Set();
    function chatLSKey(kind) { return 'sotibber_admin_chat_' + kind; }
    function loadChatFlags() {
      try { chatArchived = new Set(JSON.parse(localStorage.getItem(chatLSKey('archived')) || '[]')); } catch (e) { chatArchived = new Set(); }
      try { chatStarred = new Set(JSON.parse(localStorage.getItem(chatLSKey('starred')) || '[]')); } catch (e) { chatStarred = new Set(); }
    }
    function saveChatFlags(kind) {
      try { localStorage.setItem(chatLSKey(kind), JSON.stringify([...(kind === 'archived' ? chatArchived : chatStarred)])); } catch (e) {}
    }
    loadChatFlags();

    /* ---------------- Toast ---------------- */
    function toast(msg) {
      $('#toastMsg').textContent = msg;
      const t = $('#toast');
      t.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    /* ---------------- Sidebar (mobile) ---------------- */
    const sidebar = $('#sidebar'), overlay = $('#overlay');
    function openSb() { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
    function closeSb() { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
    $('#openSidebar').addEventListener('click', openSb);
    overlay.addEventListener('click', closeSb);

    /* ---------------- Chiqish ---------------- */
    $('#logoutBtn').addEventListener('click', () => {
      try { sessionStorage.removeItem('sotibber_admin'); } catch (e) {}
      window.location.replace('login.html');
    });

    /* ---------------- Status badge ---------------- */
    function badge(status) {
      const map = {
        'Moderatsiyada': 'bg-amber-500/15 text-amber-300 ring-amber-500/30',
        'Faol': 'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30',
        'Sotuvda': 'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30',
        'Rad etilgan': 'bg-rose-500/15 text-rose-300 ring-rose-500/30',
        'Tugadi': 'bg-slate-500/15 text-slate-300 ring-slate-500/30',
      };
      const cls = map[status] || 'bg-slate-500/15 text-slate-300 ring-slate-500/30';
      return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1 ${cls}">${esc(status)}</span>`;
    }

    /* ---------------- Ma'lumot yuklash ---------------- */
    async function loadData() {
      let loadError = false;
      try {
        const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        PRODUCTS = data || [];
      } catch (e) { console.error('Mahsulotlar:', e); PRODUCTS = []; loadError = true; }

      try {
        const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        PROFILES = data || [];
      } catch (e) { console.error('Foydalanuvchilar:', e); PROFILES = []; }

      try {
        const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        ORDERS = data || [];
      } catch (e) { console.error('Buyurtmalar:', e); ORDERS = []; }

      try {
        const { data, error } = await sb.from('affiliate_products').select('affiliate_id, product_id, archived, created_at');
        if (error) throw error;
        AFF_PRODUCTS = data || [];
      } catch (e) { console.error('Do\'kon mahsulotlari:', e); AFF_PRODUCTS = []; }

      try {
        const { data, error } = await sb.from('support_messages').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        CHAT = data || [];
      } catch (e) { console.error('Chat:', e); CHAT = []; }

      try {
        const { data, error } = await sb.from('site_settings').select('*');
        if (error) throw error;
        SETTINGS = {};
        (data || []).forEach((r) => { SETTINGS[r.key] = r.value || ''; });
      } catch (e) { console.error('Sozlamalar:', e); SETTINGS = {}; }

      try {
        const { data, error } = await sb.from('notifications').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        NOTIFS = data || [];
      } catch (e) { console.error('Bildirishnomalar:', e); NOTIFS = []; }

      // Moderatsiya olib tashlandi (mahsulotlar avto-tasdiqlanadi) — pending belgisi yashirin
      const badgeEl = $('#pendingBadge');
      if (badgeEl) badgeEl.classList.add('hidden');

      // Chat: admin o'qimagan (foydalanuvchidan kelgan) xabarlar soni
      const unread = CHAT.filter((m) => m.sender === 'user' && !m.read_by_admin).length;
      const chatBadgeEl = $('#chatBadge');
      if (unread > 0) { chatBadgeEl.textContent = unread; chatBadgeEl.classList.remove('hidden'); }
      else chatBadgeEl.classList.add('hidden');

      window.__ADMIN_LOAD_ERROR = loadError;
      render();
    }

    /* ---------------- Empty-state / RLS ogohlantirishi ---------------- */
    function policyHint() {
      return `
        <div class="glass mt-4 rounded-2xl p-5 text-sm">
          <p class="font-semibold text-amber-300">Ma'lumot ko'rinmayaptimi?</p>
          <p class="mt-1 text-slate-400">Admin panel Supabase'dagi <b>anon</b> kalit orqali o'qiydi. Barcha mahsulot va
          foydalanuvchilarni ko'rish uchun Supabase'da tegishli <b>RLS siyosatlari</b> qo'shilishi kerak
          (loyihadagi <code class="rounded bg-white/10 px-1">supabase_schema.sql</code> faylining oxiridagi "ADMIN" bo'limiga qarang).</p>
        </div>`;
    }

    /* ---------------- Ko'rinishlar ---------------- */
    function renderStats() {
      const totalUsers = PROFILES.length;
      const totalProducts = PRODUCTS.length;
      const active = PRODUCTS.filter((p) => p.status === 'Faol' || p.status === 'Sotuvda').length;
      const inventoryValue = PRODUCTS.reduce((s, p) => s + (Number(p.price) || 0) * (Number(p.stock) || 0), 0);

      const card = (label, value, sub, svg, tint) => `
        <div class="glass rounded-2xl p-5">
          <div class="flex items-center justify-between">
            <p class="text-sm text-slate-400">${label}</p>
            <span class="grid h-9 w-9 place-items-center rounded-xl ${tint}">${svg}</span>
          </div>
          <p class="font-display mt-3 text-3xl font-bold text-white">${value}</p>
          <p class="mt-1 text-xs text-slate-500">${sub}</p>
        </div>`;

      $('#viewRoot').innerHTML = `
        <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
          ${card('Foydalanuvchilar', totalUsers, 'Ro\'yxatdan o\'tganlar', '<svg class="h-5 w-5 text-violet-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4z"/></svg>', 'bg-violet-500/15')}
          ${card('Mahsulotlar', totalProducts, 'Jami yuklangan', '<svg class="h-5 w-5 text-indigo-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7"/></svg>', 'bg-indigo-500/15')}
          ${card('Faol mahsulotlar', active, 'Sotuvda', '<svg class="h-5 w-5 text-emerald-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>', 'bg-emerald-500/15')}
          ${card('Sklad qiymati', uzs(inventoryValue) + ' <span class=\'text-base text-slate-500\'>so\'m</span>', active + ' ta faol mahsulot', '<svg class="h-5 w-5 text-emerald-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V6m0 12v-2"/></svg>', 'bg-emerald-500/15')}
        </div>

        <div class="glass mt-5 rounded-2xl p-5">
          <h3 class="font-display text-base font-bold text-white">So'nggi mahsulotlar</h3>
          <div class="mt-3 space-y-2">
            ${PRODUCTS.slice(0, 5).map((p) => `
              <div class="flex items-center justify-between rounded-xl bg-white/5 px-4 py-3">
                <span class="truncate text-sm font-medium text-slate-200">${esc(p.name)}</span>
                <div class="flex items-center gap-3">
                  <span class="text-sm font-semibold text-emerald-300">${uzs(p.price)} so'm</span>
                  ${badge(p.status)}
                </div>
              </div>`).join('') || '<p class="text-sm text-slate-500">Hozircha mahsulot yo\'q.</p>'}
          </div>
        </div>
        ${(PRODUCTS.length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;
    }

    function renderProducts() {
      const rows = PRODUCTS.map((p) => {
        const owner = PROFILES.find((u) => u.id === p.seller_id);
        const ownerName = owner ? (owner.full_name || owner.phone || owner.id.slice(0, 8)) : (p.seller_id ? p.seller_id.slice(0, 8) : '—');
        return `
          <tr class="border-b border-white/5">
            <td class="px-4 py-3">

                </span>
                <span class="text-sm font-medium text-slate-100">${esc(p.name)}</span>

              </div>
            </td>
          </tr>`;
      }).join('');

      $('#viewRoot').innerHTML = `
        <div class="glass overflow-hidden rounded-2xl">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[720px]">
              <thead>
                <tr class="border-b border-white/10 text-left text-xs uppercase tracking-wide text-slate-500">
                  <th class="px-4 py-3 font-semibold">Mahsulot</th>
                  <th class="px-4 py-3 font-semibold">Sotuvchi</th>
                  <th class="px-4 py-3 font-semibold">Narx</th>

          </div>
        </div>
        ${(PRODUCTS.length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;
    }

    // Pul formati
    function money(n) { return (Math.round(Number(n) || 0)).toLocaleString('ru-RU'); }

    /* ---------------- Hisob (platforma foydasi) ---------------- */
    const PLATFORM_FEE = 0.01; // 1% — har bir pul chiqarishda ushlab qolinadi

    function renderAccount() {
      const valid = ORDERS.filter((o) => o.status !== 'Rad etildi' && o.status !== 'Rad etilgan');
      const now = new Date();
      const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const startMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      const sumTotal = (arr) => arr.reduce((s, o) => s + (Number(o.total) || 0), 0);
      const fee = (v) => Math.round(v * PLATFORM_FEE);

      const gmv = sumTotal(valid);
      const todayGmv = sumTotal(valid.filter((o) => o.created_at && new Date(o.created_at).getTime() >= startToday));
      const monthGmv = sumTotal(valid.filter((o) => o.created_at && new Date(o.created_at).getTime() >= startMonth));
      const agentCommission = valid.reduce((s, o) => s + (Number(o.commission) || 0), 0);

      // Kunlik: sana bo'yicha aylanma + 1% foyda
      const byDay = {};
      valid.forEach((o) => {
        const dt = o.created_at ? new Date(o.created_at) : null;
        const key = dt ? dt.toISOString().slice(0, 10) : '—';
        if (!byDay[key]) byDay[key] = { turnover: 0, count: 0, label: dt ? dt.toLocaleDateString('ru-RU') : '—' };
        byDay[key].turnover += (Number(o.total) || 0);
        byDay[key].count += 1;
      });
      const days = Object.keys(byDay).sort((a, b) => b.localeCompare(a)).map((k) => ({ label: byDay[k].label, turnover: byDay[k].turnover, count: byDay[k].count, profit: fee(byDay[k].turnover) }));

      const stat = (label, value, sub, tint, ic) => `
        <div class="glass rounded-2xl p-5">
          <span class="grid h-10 w-10 place-items-center rounded-xl ${tint}"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">${ic}</svg></span>
          <p class="font-display mt-3 text-2xl font-bold text-white">${value}</p>
          <p class="mt-0.5 text-xs text-slate-400">${label}</p>
          ${sub ? `<p class="mt-0.5 text-[11px] text-slate-500">${sub}</p>` : ''}
        </div>`;

      const rows = days.length ? days.map((d) => `
        <tr class="border-b border-white/5">
          <td class="px-4 py-3 text-sm text-slate-300">${esc(d.label)}</td>
          <td class="px-4 py-3 text-sm text-slate-400">${d.count} ta</td>
          <td class="px-4 py-3 text-sm text-slate-200">${money(d.turnover)} so'm</td>
          <td class="px-4 py-3 text-sm font-bold text-emerald-300">${money(d.profit)} so'm</td>
        </tr>`).join('') : `<tr><td colspan="4" class="px-4 py-10 text-center text-sm text-slate-500">Hali savdo yo'q.</td></tr>`;

      $('#viewRoot').innerHTML = `
        <div class="space-y-6">
          <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
            ${stat('Bugungi foyda', money(fee(todayGmv)) + " so'm", 'pul chiqarish komissiyasi (1%)', 'bg-emerald-500/15 text-emerald-300', '<path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V6m0 12v-2"/>')}
            ${stat('Bu oy foyda', money(fee(monthGmv)) + " so'm", null, 'bg-violet-500/15 text-violet-300', '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>')}
            ${stat('Umumiy foyda', money(fee(gmv)) + " so'm", 'barcha vaqt', 'bg-amber-500/15 text-amber-300', '<path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 10a2 2 0 012-2h14a2 2 0 012 2m-18 0v8a2 2 0 002 2h14a2 2 0 002-2v-8M7 15h4"/>')}
            ${stat('Umumiy aylanma', money(gmv) + " so'm", 'jami savdo hajmi', 'bg-blue-500/15 text-blue-300', '<path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M9 17V9m4 8V5m4 12v-6"/>')}
          </div>

          <div class="glass rounded-2xl p-5 text-sm">
            <p class="font-semibold text-white">Platforma foydasi qanday hisoblanadi?</p>
            <p class="mt-1.5 text-slate-400">Har bir foydalanuvchi (sotuvchi/sotib beruvchi) hisobidan pul chiqarganda <b class="text-emerald-300">${(PLATFORM_FEE * 100).toFixed(0)}% komissiya</b> ushlab qolinadi — bu platformaning foydasi. Yuqoridagi raqamlar savdo aylanmasidan (buyurtmalar summasidan) hisoblanadi. Jami agentlarga to'langan komissiya: <b class="text-slate-200">${money(agentCommission)} so'm</b>.</p>
          </div>

          <div class="glass overflow-hidden rounded-2xl">
            <div class="border-b border-white/10 px-5 py-4">
              <h3 class="font-display font-bold text-white">Kunlik foyda</h3>
              <p class="text-xs text-slate-400">Har kunlik aylanma va undan tushgan foyda (${(PLATFORM_FEE * 100).toFixed(0)}%)</p>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full min-w-[520px]">
                <thead>
                  <tr class="border-b border-white/10 text-left text-xs uppercase tracking-wide text-slate-500">
                    <th class="px-4 py-3 font-semibold">Sana</th>
                    <th class="px-4 py-3 font-semibold">Savdolar</th>
                    <th class="px-4 py-3 font-semibold">Aylanma</th>
                    <th class="px-4 py-3 font-semibold">Foyda (${(PLATFORM_FEE * 100).toFixed(0)}%)</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
          ${(ORDERS.length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}
        </div>`;
    }

    // Foydalanuvchi roli — profildagi role yoki ma'lumotdan aniqlaymiz
    function userRoles(u) {
      const isSeller = u.role === 'seller' || PRODUCTS.some((p) => p.seller_id === u.id);
      const isReseller = u.role === 'affiliate' || AFF_PRODUCTS.some((a) => a.affiliate_id === u.id);
      return { isSeller, isReseller };
    }
    function roleBadges(u) {
      const { isSeller, isReseller } = userRoles(u);
      let out = '';
      if (isSeller) out += '<span class="inline-flex items-center rounded-full bg-violet-500/15 px-2 py-0.5 text-[11px] font-semibold text-violet-300 ring-1 ring-violet-400/25">Sotuvchi</span>';
      if (isReseller) out += ' <span class="inline-flex items-center rounded-full bg-emerald-500/15 px-2 py-0.5 text-[11px] font-semibold text-emerald-300 ring-1 ring-emerald-400/25">Sotib beruvchi</span>';
      return out || '<span class="text-xs text-slate-500">—</span>';
    }

    function filteredUsers() {
      const q = userQuery.trim().toLowerCase();
      if (!q) return PROFILES;
      return PROFILES.filter((u) =>
        String(u.id || '').toLowerCase().includes(q) ||
        String(u.full_name || '').toLowerCase().includes(q) ||
        String(u.shop_name || '').toLowerCase().includes(q) ||
        String(u.phone || '').toLowerCase().includes(q) ||
        (u.shop_no != null && String(u.shop_no).includes(q))
      );
    }

    function renderUsersRows() {
      const tb = $('#usersTbody');
      if (!tb) return;
      const rows = filteredUsers().map((u) => {
        const count = PRODUCTS.filter((p) => p.seller_id === u.id).length;
        const date = u.created_at ? new Date(u.created_at).toLocaleDateString('ru-RU') : '—';
        const blocked = !!u.blocked;
        return `
          <tr class="border-b border-white/5 transition hover:bg-white/5 ${blocked ? 'opacity-60' : ''}">
            <td class="px-4 py-3">
              <div class="flex items-center gap-3">
                <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-xs font-bold text-white">${esc((u.full_name || 'U').slice(0, 1).toUpperCase())}</span>
                <div class="min-w-0">
                  <div class="flex items-center gap-2"><span class="truncate text-sm font-medium text-slate-100">${esc(u.full_name || 'Nomsiz')}</span>${blocked ? '<span class="rounded-full bg-rose-500/15 px-2 py-0.5 text-[10px] font-bold text-rose-300 ring-1 ring-rose-500/30">Bloklangan</span>' : ''}</div>
                  <div class="mt-0.5 flex flex-wrap gap-1">${roleBadges(u)}</div>
                </div>
              </div>
            </td>
            <td class="px-4 py-3 text-sm text-slate-400">${esc(u.phone || '—')}</td>
            <td class="px-4 py-3 text-sm text-slate-300">${count} ta</td>
            <td class="px-4 py-3 text-sm text-slate-400">${esc(date)}</td>
            <td class="px-4 py-3">
              <div class="flex items-center justify-end gap-1.5">
                <button data-user-detail="${esc(u.id)}" class="rounded-lg bg-white/5 px-2.5 py-1.5 text-xs font-semibold text-slate-200 ring-1 ring-white/10 transition hover:bg-white/10">Batafsil</button>
                <button data-user-block="${esc(u.id)}" data-block="${blocked ? '0' : '1'}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold ring-1 transition ${blocked ? 'bg-emerald-500/15 text-emerald-300 ring-emerald-500/25 hover:bg-emerald-500/25' : 'bg-amber-500/15 text-amber-300 ring-amber-500/25 hover:bg-amber-500/25'}">${blocked ? 'Ochish' : 'Bloklash'}</button>
                <button data-user-delete="${esc(u.id)}" class="rounded-lg bg-rose-500/10 px-2.5 py-1.5 text-xs font-semibold text-rose-300 ring-1 ring-rose-500/20 transition hover:bg-rose-500/20">O'chirish</button>
              </div>
            </td>
          </tr>`;
      }).join('');
      tb.innerHTML = rows || `<tr><td colspan="5" class="px-4 py-10 text-center text-sm text-slate-500">Foydalanuvchi topilmadi.</td></tr>`;
    }

    function renderUsers() {
      $('#viewRoot').innerHTML = `
        <div class="mb-4">
          <div class="relative max-w-md">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
            <input id="userSearch" type="text" value="${esc(userQuery)}" placeholder="ism, telefon, do'kon № yoki user ID bilan qidirish" class="w-full rounded-xl border border-white/10 bg-white/5 py-2.5 pl-10 pr-3 text-sm text-slate-100 outline-none placeholder:text-slate-500 focus:border-violet-400/60" />
          </div>
        </div>
        <div class="glass overflow-hidden rounded-2xl">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[680px]">
              <thead>
                <tr class="border-b border-white/10 text-left text-xs uppercase tracking-wide text-slate-500">
                  <th class="px-4 py-3 font-semibold">Foydalanuvchi</th>
                  <th class="px-4 py-3 font-semibold">Telefon</th>
                  <th class="px-4 py-3 font-semibold">Mahsulotlari</th>
                  <th class="px-4 py-3 font-semibold">Ro'yxatdan o'tgan</th>
                  <th class="px-4 py-3 text-right font-semibold">Amallar</th>
                </tr>
              </thead>
              <tbody id="usersTbody"></tbody>
            </table>
          </div>
        </div>
        ${(PROFILES.length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;
      renderUsersRows();
      const si = $('#userSearch');
      if (si) si.addEventListener('input', (e) => { userQuery = e.target.value; renderUsersRows(); });
    }

    /* ---------------- Foydalanuvchi: modal / blok / o'chirish ---------------- */
    function openModal(html) {
      let root = document.getElementById('adminModalRoot');
      if (!root) { root = document.createElement('div'); root.id = 'adminModalRoot'; document.body.appendChild(root); }
      root.innerHTML = `<div class="fixed inset-0 z-[80] flex items-center justify-center p-4"><div data-mclose class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div><div class="glass relative z-10 max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-3xl text-slate-200 shadow-2xl">${html}</div></div>`;
      document.body.style.overflow = 'hidden';
    }
    function closeModal() { const r = document.getElementById('adminModalRoot'); if (r) r.innerHTML = ''; document.body.style.overflow = ''; }

    function userDetailModal(uid) {
      const u = PROFILES.find((p) => p.id === uid);
      if (!u) return;
      const { isSeller, isReseller } = userRoles(u);
      const ownProducts = PRODUCTS.filter((p) => p.seller_id === uid);
      const resellerLinks = AFF_PRODUCTS.filter((a) => a.affiliate_id === uid);
      const prodName = (pid) => { const p = PRODUCTS.find((x) => x.id === pid); return p ? p.name : 'Mahsulot'; };
      const sellerOrders = ORDERS.filter((o) => o.seller_id === uid);
      const resellerOrders = ORDERS.filter((o) => o.affiliate_id === uid);
      const sellerEarn = sellerOrders.reduce((s, o) => s + ((Number(o.total) || 0) - (Number(o.commission) || 0)), 0);
      const resellerEarn = resellerOrders.reduce((s, o) => s + (Number(o.commission) || 0), 0);
      const balance = sellerEarn + resellerEarn;
      const allOrders = Array.from(new Map([...sellerOrders, ...resellerOrders].map((o) => [o.id, o])).values())
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      const soc = (u.socials && typeof u.socials === 'object') ? u.socials : {};
      const messengers = [
        ['Instagram', soc.instagram || u.instagram],
        ['Telegram', soc.telegram],
        ['Facebook', soc.facebook],
        ['TikTok', soc.tiktok],
        ['YouTube', soc.youtube],
      ].filter(([, v]) => v);

      const stat = (label, value, tint) => `
        <div class="rounded-2xl bg-white/5 p-4 ring-1 ring-white/10">
          <p class="font-display text-2xl font-bold text-white">${value}</p>
          <p class="text-xs text-slate-400">${label}</p>
        </div>`;

      const prodRow = (name, sub, right) => `
        <div class="flex items-center justify-between gap-3 rounded-xl bg-white/5 px-3 py-2 ring-1 ring-white/10">
          <span class="min-w-0"><span class="block truncate text-sm text-slate-100">${esc(name)}</span>${sub ? `<span class="block text-[11px] text-slate-500">${esc(sub)}</span>` : ''}</span>
          ${right || ''}
        </div>`;

      const ownList = ownProducts.length ? ownProducts.map((p) => prodRow(p.name, (money(p.price) + " so'm · Sklad: " + (p.stock ?? 0)), badge(p.status))).join('') : '<p class="px-1 py-2 text-xs text-slate-500">Mahsulot yo\'q</p>';
      const relList = resellerLinks.length ? resellerLinks.map((a) => prodRow(prodName(a.product_id), a.archived ? 'arxivlangan' : "do'konida", '')).join('') : '<p class="px-1 py-2 text-xs text-slate-500">Hech narsa qo\'shmagan</p>';
      const salesList = allOrders.length ? allOrders.slice(0, 40).map((o) => `
        <div class="flex items-center justify-between gap-3 rounded-xl bg-white/5 px-3 py-2 text-sm ring-1 ring-white/10">
          <span class="min-w-0"><span class="block truncate text-slate-100">${esc(o.product_name || 'Mahsulot')}</span><span class="block text-[11px] text-slate-500">${esc(o.customer_name || '')}${o.customer_phone ? ' · ' + esc(o.customer_phone) : ''} · ${o.created_at ? new Date(o.created_at).toLocaleDateString('ru-RU') : ''}</span></span>
          <span class="shrink-0 text-right"><span class="block font-bold text-white">${money(o.total)} so'm</span>${badge(o.status)}</span>
        </div>`).join('') : '<p class="px-1 py-3 text-center text-xs text-slate-500">Savdo yo\'q</p>';

      const messengerList = messengers.length ? messengers.map(([n, v]) => `
        <span class="inline-flex items-center gap-1.5 rounded-lg bg-white/5 px-2.5 py-1 text-xs font-medium text-slate-200 ring-1 ring-white/10">${n}: <span class="text-slate-400">${esc(String(v).replace(/^https?:\/\/(www\.)?/, ''))}</span></span>`).join('') : '<p class="text-xs text-slate-500">Hech qanday messenjer ulanmagan</p>';

      openModal(`
        <div>
          <div class="flex items-center justify-between border-b border-white/10 px-6 py-4">
            <div class="flex min-w-0 items-center gap-3">
              <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-sm font-bold text-white">${esc((u.full_name || 'U').slice(0, 1).toUpperCase())}</span>
              <div class="min-w-0">
                <h3 class="truncate font-display text-lg font-bold text-white">${esc(u.full_name || 'Nomsiz')}</h3>
                <div class="mt-0.5 flex flex-wrap items-center gap-1.5">${roleBadges(u)}${u.blocked ? '<span class="rounded-full bg-rose-500/15 px-2 py-0.5 text-[10px] font-bold text-rose-300 ring-1 ring-rose-500/30">Bloklangan</span>' : ''}</div>
              </div>
            </div>
            <button type="button" data-mclose class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-slate-400 hover:bg-white/10"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
          </div>
          <div class="space-y-4 p-6">
            <div class="rounded-2xl bg-white/5 p-3 text-xs text-slate-400 ring-1 ring-white/10">
              <div class="flex justify-between gap-3 py-0.5"><span>User ID</span><span class="font-mono text-slate-300">${esc(u.id)}</span></div>
              <div class="flex justify-between gap-3 py-0.5"><span>Telefon</span><span class="text-slate-300">${esc(u.phone || '—')}</span></div>
              <div class="flex justify-between gap-3 py-0.5"><span>Do'kon №</span><span class="text-slate-300">${u.shop_no != null ? String(u.shop_no).padStart(4, '0') : '—'}${u.shop_name ? ' · ' + esc(u.shop_name) : ''}</span></div>
              <div class="flex justify-between gap-3 py-0.5"><span>Ro'yxatdan o'tgan</span><span class="text-slate-300">${u.created_at ? new Date(u.created_at).toLocaleString('ru-RU') : '—'}</span></div>
            </div>

            <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
              ${stat('Hisobida (hisoblangan)', money(balance) + " so'm", '')}
              ${stat('Chiqarilgan', '0 so\'m', '')}
              ${stat('Savdolar', allOrders.length, '')}
              ${stat("Do'kondagi mahsulot", ownProducts.length + resellerLinks.length, '')}
            </div>
            <p class="-mt-2 text-[11px] text-slate-500">Daromad buyurtmalardan hisoblanadi: sotuvchi uchun (summa − komissiya), sotib beruvchi uchun komissiya. Pul chiqarish tizimi hali ulanmagani uchun "Chiqarilgan" = 0.</p>

            <div>
              <p class="mb-2 text-sm font-semibold text-slate-300">Ulangan messenjerlar</p>
              <div class="flex flex-wrap gap-2">${messengerList}</div>
            </div>

            ${isSeller ? `<div><p class="mb-2 text-sm font-semibold text-slate-300">O'z mahsulotlari (sotuvchi) — ${ownProducts.length} ta</p><div class="space-y-1.5">${ownList}</div></div>` : ''}
            ${isReseller ? `<div><p class="mb-2 text-sm font-semibold text-slate-300">Do'koniga qo'shgan (sotib beruvchi) — ${resellerLinks.length} ta</p><div class="space-y-1.5">${relList}</div></div>` : ''}

            <div>
              <p class="mb-2 text-sm font-semibold text-slate-300">Barcha savdolari — ${allOrders.length} ta</p>
              <div class="space-y-1.5">${salesList}</div>
            </div>
          </div>
          <div class="flex flex-wrap gap-3 border-t border-white/10 p-6">
            <button type="button" data-mclose class="flex-1 rounded-xl border border-white/10 bg-white/5 py-3 text-sm font-semibold text-slate-200 transition hover:bg-white/10">Yopish</button>
            <button type="button" data-user-block="${esc(u.id)}" data-block="${u.blocked ? '0' : '1'}" class="flex-1 rounded-xl py-3 text-sm font-bold transition ${u.blocked ? 'bg-emerald-500/15 text-emerald-300 ring-1 ring-emerald-500/25 hover:bg-emerald-500/25' : 'bg-amber-500/15 text-amber-300 ring-1 ring-amber-500/25 hover:bg-amber-500/25'}">${u.blocked ? 'Blokni ochish' : 'Bloklash'}</button>
            <button type="button" data-user-delete="${esc(u.id)}" class="flex-1 rounded-xl bg-rose-500/15 py-3 text-sm font-bold text-rose-300 ring-1 ring-rose-500/25 transition hover:bg-rose-500/25">O'chirish</button>

      `);

    async function blockUser(uid, block) {
      const u = PROFILES.find((p) => p.id === uid);
      if (!u) return;
      if (block && !confirm((u.full_name || 'Foydalanuvchi') + ' akkauntini bloklaysizmi? U tizimga kira olmaydi.')) return;
      const { error } = await sb.from('profiles').update({ blocked: block }).eq('id', uid);
      if (error) { console.error(error); toast(/blocked|column|policy|row-level|schema cache/i.test(error.message || '') ? "Bloklab bo'lmadi — supabase_qoshimcha.sql'ni ishga tushiring" : 'Xatolik: ' + (error.message || '')); return; }
      u.blocked = block;
      toast(block ? 'Foydalanuvchi bloklandi' : 'Blok ochildi');
      closeModal();
      renderUsersRows();
    }

    async function deleteUser(uid) {
      const u = PROFILES.find((p) => p.id === uid);
      if (!u) return;
      if (!confirm((u.full_name || 'Foydalanuvchi') + " ma'lumotlarini butunlay o'chirasizmi? Profil, mahsulotlar va do'kon yozuvlari o'chadi. Qaytarib bo'lmaydi.")) return;
      try {
        await sb.from('affiliate_products').delete().eq('affiliate_id', uid);
        await sb.from('products').delete().eq('seller_id', uid);
        const { error } = await sb.from('profiles').delete().eq('id', uid);
        if (error) throw error;
        toast("Foydalanuvchi o'chirildi");
        closeModal();
        loadData();
      } catch (e) {
        console.error(e);
        toast(/policy|row-level|permission/i.test(e.message || '') ? "O'chirib bo'lmadi — supabase_qoshimcha.sql'ni ishga tushiring" : 'Xatolik: ' + (e.message || ''));
      }
    }

    /* ---------------- Chat (savol-javob) ---------------- */
    function userName(uid) {
      const u = PROFILES.find((p) => p.id === uid);
      return u ? (u.full_name || u.phone || uid.slice(0, 8)) : (uid ? uid.slice(0, 8) : '—');
    }
    function timeStr(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function convInPeriod(c) {
      if (chatFilter === 'all') return true;
      if (!c.last) return true;
      const span = chatFilter === 'day' ? 864e5 : chatFilter === 'week' ? 7 * 864e5 : 30 * 864e5;
      return (Date.now() - new Date(c.last.created_at).getTime()) <= span;
    }

    function chatFilterBar() {
      const periods = [['all', 'Barchasi'], ['day', 'Kunlik'], ['week', 'Haftalik'], ['month', 'Oylik']];
      const pill = (v, l) => `<button data-chat-filter="${v}" class="whitespace-nowrap rounded-lg px-2.5 py-1.5 text-xs font-semibold transition ${chatFilter === v ? 'btn-grad text-white' : 'bg-white/5 text-slate-300 ring-1 ring-white/10 hover:bg-white/10'}">${l}</button>`;
      const starI = '<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01z"/></svg>';
      const arcI = '<svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18v4H3zM5 8v11a1 1 0 001 1h12a1 1 0 001-1V8M9.5 12h5"/></svg>';
      return `
        <div class="glass rounded-2xl p-2">
          <div class="no-scrollbar flex gap-1.5 overflow-x-auto">${periods.map(([v, l]) => pill(v, l)).join('')}</div>
          <div class="mt-1.5 flex gap-1.5">
            <button data-chat-starred-toggle class="inline-flex flex-1 items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold transition ${chatStarredOnly ? 'bg-amber-500/20 text-amber-200 ring-1 ring-amber-400/40' : 'bg-white/5 text-slate-300 ring-1 ring-white/10 hover:bg-white/10'}">${starI} Muhim</button>
            <button data-chat-archived-toggle class="inline-flex flex-1 items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold transition ${chatShowArchived ? 'bg-violet-500/20 text-violet-200 ring-1 ring-violet-400/40' : 'bg-white/5 text-slate-300 ring-1 ring-white/10 hover:bg-white/10'}">${arcI} Arxiv</button>
          </div>
        </div>`;
    }

    function renderChat() {
      // Yozilayotgan javob matnini saqlab qolamiz (filter/arxiv bosilganda yo'qolmasin)
      const prevReply = $('#chatReplyInput');
      const keepReply = prevReply ? { v: prevReply.value, f: document.activeElement === prevReply } : null;

      // Suhbatlarni foydalanuvchi bo'yicha guruhlaymiz
      const byUser = {};
      CHAT.forEach((m) => {
        (byUser[m.user_id] = byUser[m.user_id] || []).push(m);
      });
      const convos = Object.keys(byUser).map((uid) => {
        const msgs = byUser[uid];
        const last = msgs[msgs.length - 1];
        const unread = msgs.filter((m) => m.sender === 'user' && !m.read_by_admin).length;
        return { uid, msgs, last, unread };
      }).sort((a, b) => new Date(b.last.created_at) - new Date(a.last.created_at));

      // Filtrlar: arxiv / muhim / davr
      let list = convos.filter((c) => (chatShowArchived ? chatArchived.has(c.uid) : !chatArchived.has(c.uid)));
      if (chatStarredOnly) list = list.filter((c) => chatStarred.has(c.uid));
      list = list.filter(convInPeriod);

      // Tanlangan suhbat topilmasa, ro'yxatdagi birinchisini olamiz
      if (chatSelectedUser && !byUser[chatSelectedUser]) chatSelectedUser = null;
      if (!chatSelectedUser && list.length) chatSelectedUser = list[0].uid;

      const star = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="{fill}" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01z"/></svg>';
      const restoreI = '<svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15l-4-4 4-4M5 11h9a5 5 0 010 10h-3"/></svg>';
      const archiveI = '<svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18v4H3zM5 8v11a1 1 0 001 1h12a1 1 0 001-1V8M9.5 12h5"/></svg>';

      const listHtml = list.map((c) => {
        const active = c.uid === chatSelectedUser;
        const starred = chatStarred.has(c.uid);
        return `
          <div class="flex items-center gap-1 rounded-xl pr-1 transition ${active ? 'bg-violet-500/15 ring-1 ring-violet-400/40' : 'hover:bg-white/5'}">
            <button data-open-convo="${c.uid}" class="flex min-w-0 flex-1 items-center gap-3 rounded-xl px-2.5 py-2.5 text-left">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-xs font-bold text-white">${esc(userName(c.uid).slice(0, 1).toUpperCase())}</span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center justify-between gap-2">
                  <span class="truncate text-sm font-semibold text-white">${esc(userName(c.uid))}</span>
                  ${c.unread ? `<span class="shrink-0 rounded-full bg-rose-500/25 px-1.5 text-[10px] font-bold text-rose-200">${c.unread}</span>` : ''}
                </span>
                <span class="block truncate text-xs text-slate-400">${c.last.sender === 'admin' ? 'Siz: ' : ''}${esc(c.last.body)}</span>
              </span>
            </button>
            <div class="flex shrink-0 items-center gap-0.5">
              <button data-star-convo="${c.uid}" title="${starred ? 'Muhimdan olib tashlash' : 'Muhim'}" class="grid h-7 w-7 place-items-center rounded-lg ${starred ? 'text-amber-300' : 'text-slate-500 hover:text-amber-300'}">${star.replace('{fill}', starred ? 'currentColor' : 'none')}</button>
              <button data-archive-convo="${c.uid}" title="${chatShowArchived ? 'Arxivdan qaytarish' : 'Arxivlash'}" class="grid h-7 w-7 place-items-center rounded-lg text-slate-500 hover:text-violet-300">${chatShowArchived ? restoreI : archiveI}</button>
            </div>
          </div>`;
      }).join('') || `<p class="px-3 py-6 text-center text-sm text-slate-500">${chatShowArchived ? 'Arxivda suhbat yo\'q' : chatStarredOnly ? 'Muhim suhbatlar yo\'q' : chatFilter !== 'all' ? 'Bu davrda suhbat yo\'q' : 'Hozircha savollar yo\'q.'}</p>`;

      const sel = chatSelectedUser ? byUser[chatSelectedUser] : null;
      const threadHtml = sel ? sel.map((m) => {
        const mine = m.sender === 'admin';
        return `
          <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[78%] rounded-2xl px-3.5 py-2 text-sm ${mine ? 'bg-gradient-to-br from-violet-brand to-violet-deep text-white' : 'bg-white/8 text-slate-100 ring-1 ring-white/10'}">
              <p class="whitespace-pre-wrap break-words">${esc(m.body)}</p>
              <p class="mt-1 text-[10px] ${mine ? 'text-white/60' : 'text-slate-400'}">${timeStr(m.created_at)}</p>
            </div>
          </div>`;
      }).join('') : '';

      $('#viewRoot').innerHTML = `
        <div class="grid gap-4 lg:grid-cols-[300px_1fr]">
          <!-- Filter + suhbatlar ro'yxati -->
          <div class="flex flex-col gap-2 lg:max-h-[calc(100vh-11rem)]">
            ${chatFilterBar()}
            <div class="glass min-h-0 flex-1 rounded-2xl p-2 lg:overflow-y-auto">
              ${listHtml}
            </div>
          </div>
          <!-- Tanlangan suhbat -->
          <div class="glass flex flex-col rounded-2xl lg:h-[calc(100vh-11rem)]">
            ${sel ? `
              <div class="flex items-center gap-3 border-b border-white/10 px-4 py-3">
                <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-violet-brand to-violet-deep text-xs font-bold text-white">${esc(userName(chatSelectedUser).slice(0, 1).toUpperCase())}</span>
                <div>
                  <p class="text-sm font-semibold text-white">${esc(userName(chatSelectedUser))}</p>
                  <p class="text-[11px] text-slate-500">Foydalanuvchi bilan suhbat</p>
                </div>
              </div>
              <div id="chatThread" class="flex-1 space-y-2.5 overflow-y-auto p-4">${threadHtml}</div>
              <form id="chatReplyForm" class="flex items-center gap-2 border-t border-white/10 p-3">
                <input id="chatReplyInput" type="text" autocomplete="off" placeholder="Javob yozing..." class="flex-1 rounded-xl bg-white/5 px-3.5 py-2.5 text-sm text-slate-100 outline-none ring-1 ring-white/10 placeholder:text-slate-500 focus:ring-violet-400/50" />
                <button type="submit" class="btn-grad grid h-10 w-10 shrink-0 place-items-center rounded-xl text-white">
                  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
              </form>
            ` : `
              <div class="flex flex-1 items-center justify-center p-10 text-center text-sm text-slate-500">
                Chapdan suhbatni tanlang yoki hozircha savol yo'q.
              </div>
            `}
          </div>
        </div>
        ${(CHAT.length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;

      // Threadni pastga scroll qilamiz
      const thread = $('#chatThread');
      if (thread) thread.scrollTop = thread.scrollHeight;

      // Yozilayotgan javob matnini tiklaymiz
      if (keepReply) {
        const inp = $('#chatReplyInput');
        if (inp) { inp.value = keepReply.v; if (keepReply.f) inp.focus(); }
      }

      // Ochilgan suhbatdagi o'qilmagan xabarlarni "o'qildi" deb belgilaymiz
      markConvoRead(chatSelectedUser);
    }

    async function markConvoRead(uid) {
      if (!uid) return;
      const unreadIds = CHAT.filter((m) => m.user_id === uid && m.sender === 'user' && !m.read_by_admin).map((m) => m.id);
      if (!unreadIds.length) return;
      CHAT.forEach((m) => { if (unreadIds.includes(m.id)) m.read_by_admin = true; });
      const unread = CHAT.filter((m) => m.sender === 'user' && !m.read_by_admin).length;
      const chatBadgeEl = $('#chatBadge');
      if (unread > 0) { chatBadgeEl.textContent = unread; chatBadgeEl.classList.remove('hidden'); }
      else chatBadgeEl.classList.add('hidden');
      try { await sb.from('support_messages').update({ read_by_admin: true }).in('id', unreadIds); } catch (e) { console.error(e); }
    }

    async function sendReply(body) {
      if (!chatSelectedUser || !body.trim()) return;
      const text = body.trim();
      const { data, error } = await sb.from('support_messages')
        .insert({ user_id: chatSelectedUser, sender: 'admin', body: text, read_by_admin: true })
        .select().single();
      if (error) { console.error(error); toast('Xatolik: javob yuborilmadi'); return; }
      CHAT.push(data);
      renderChat();
    }

    /* ---------------- Sozlamalar (messenjer havolalari) ---------------- */
    const SOCIALS = [
      { key: 'telegram', label: 'Telegram', ph: 'https://t.me/kanal_nomi', tint: 'text-sky-300 bg-sky-500/15',

      { key: 'instagram', label: 'Instagram', ph: 'https://instagram.com/profil', tint: 'text-pink-300 bg-pink-500/15',
        icon: '<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2"/>' },
      { key: 'youtube', label: 'YouTube', ph: 'https://youtube.com/@kanal', tint: 'text-red-300 bg-red-500/15',
        icon: '<path d="M23 12s0-3.5-.4-5.2c-.3-1-1-1.7-2-2C18.9 4.5 12 4.5 12 4.5s-6.9 0-8.6.3c-1 .3-1.7 1-2 2C1 8.5 1 12 1 12s0 3.5.4 5.2c.3 1 1 1.7 2 2 1.7.3 8.6.3 8.6.3s6.9 0 8.6-.3c1-.3 1.7-1 2-2 .4-1.7.4-5.2.4-5.2ZM9.8 15.3V8.7l5.7 3.3-5.7 3.3Z"/>' },
    ];

    function renderSettings() {
      const rows = SOCIALS.map((s) => `
        <label class="block">
          <span class="mb-1.5 flex items-center gap-2 text-sm font-semibold text-slate-200">
            <span class="grid h-7 w-7 place-items-center rounded-lg ${s.tint}"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">${s.icon}</svg></span>
            ${s.label}
          </span>
          <input type="url" data-setting="${s.key}" value="${esc(SETTINGS[s.key] || '')}" placeholder="${s.ph}"

        </label>`).join('');

      $('#viewRoot').innerHTML = `
        <div class="mx-auto max-w-2xl">
          <div class="glass rounded-2xl p-6">
            <h3 class="font-display text-lg font-bold text-white">Messenjer havolalari</h3>
            <p class="mt-1 text-sm text-slate-400">Bu havolalar saytning pastki qismidagi (footer) tugmalarga qo'yiladi. Bo'sh qoldirilsa, tugma bosilmaydi.</p>
            <form id="settingsForm" class="mt-6 space-y-5">
              ${rows}
              <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="btn-grad rounded-xl px-6 py-2.5 text-sm font-bold text-white">Saqlash</button>
                <span id="settingsSaved" class="hidden text-sm font-medium text-emerald-300">Saqlandi ✓</span>
              </div>
            </form>
          </div>
        </div>
        ${(Object.keys(SETTINGS).length === 0 && window.__ADMIN_LOAD_ERROR) ? policyHint() : ''}`;
    }

    async function saveSettings(form) {
      const rows = SOCIALS.map((s) => ({
        key: s.key,
        value: (form.querySelector(`[data-setting="${s.key}"]`).value || '').trim(),
        updated_at: new Date().toISOString(),
      }));
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
      const { error } = await sb.from('site_settings').upsert(rows, { onConflict: 'key' });
      btn.disabled = false; btn.textContent = 'Saqlash';
      if (error) {
        console.error(error);
        const missing = error.code === 'PGRST205' || /schema cache|does not exist|find the table/i.test(error.message || '');
        toast(missing
          ? "Jadval topilmadi — avval Supabase'da supabase_schema.sql'ni ishga tushiring"
          : 'Xatolik: ' + (error.message || 'saqlab bo\'lmadi'));
        return;
      }
      rows.forEach((r) => { SETTINGS[r.key] = r.value; });
      const ok = $('#settingsSaved');
      ok.classList.remove('hidden');
      setTimeout(() => ok.classList.add('hidden'), 2500);
      toast('Sozlamalar saqlandi ✓');
    }

    async function sendNotification(form) {
      const audience = form.querySelector('#notifAudience').value;
      const title = form.querySelector('#notifTitle').value.trim();
      const body = form.querySelector('#notifBody').value.trim();
      if (!body) { toast('Matn kiriting'); return; }
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Yuborilmoqda...';
      const { data, error } = await sb.from('notifications').insert({ audience, title: title || null, body }).select().single();
      btn.disabled = false; btn.textContent = 'Yuborish';
      if (error) {
        console.error(error);
        const missing = /notifications|does not exist|schema cache|find the table/i.test(error.message || '');
        toast(missing ? "Jadval topilmadi — supabase_qoshimcha.sql'ni ishga tushiring" : 'Xatolik: ' + (error.message || 'yuborilmadi'));
        return;
      }
      NOTIFS.unshift(data);
      renderNotifications();
      toast('Bildirishnoma yuborildi ✓');
    }

    async function deleteNotification(id) {
      if (!confirm('Bildirishnomani o\'chirasizmi?')) return;
      const { error } = await sb.from('notifications').delete().eq('id', id);
      if (error) { console.error(error); toast('Xatolik: o\'chirib bo\'lmadi'); return; }
      NOTIFS = NOTIFS.filter((n) => n.id !== id);
      renderNotifications();
      toast('O\'chirildi');
    }

    function render() {
      const titles = { stats: 'Statistika', products: 'Mahsulotlar', users: 'Foydalanuvchilar', account: 'Hisob', chat: 'Savol-javob chat', notifications: 'Bildirishnomalar', settings: 'Messenjer' };
      $('#viewTitle').textContent = titles[currentView] || 'Admin';
      if (currentView === 'stats') renderStats();
      else if (currentView === 'products') renderProducts();
      else if (currentView === 'users') renderUsers();
      else if (currentView === 'account') renderAccount();
      else if (currentView === 'chat') renderChat();
      else if (currentView === 'notifications') renderNotifications();
      else if (currentView === 'settings') renderSettings();
    }

    /* ---------------- Moderatsiya amallari ---------------- */
    async function setStatus(id, status) {
      const { error } = await sb.from('products').update({ status }).eq('id', id);
      if (error) { console.error(error); toast('Xatolik: ' + (error.message || 'yangilab bo\'lmadi')); return; }
      const p = PRODUCTS.find((x) => x.id === id);
      if (p) p.status = status;
      toast(status === 'Faol' ? 'Mahsulot tasdiqlandi ✓' : 'Mahsulot rad etildi');
      loadData();
    }

    async function removeProduct(id) {
      if (!confirm('Mahsulotni o\'chirishni tasdiqlaysizmi?')) return;
      const { error } = await sb.from('products').delete().eq('id', id);
      if (error) { console.error(error); toast('Xatolik: ' + (error.message || 'o\'chirib bo\'lmadi')); return; }
      toast('Mahsulot o\'chirildi');
      loadData();
    }

    /* ---------------- Hodisalarni delegatsiya qilish ---------------- */
    $('#viewRoot').addEventListener('click', (e) => {
      const ap = e.target.closest('[data-approve]');
      const rj = e.target.closest('[data-reject]');
      const dl = e.target.closest('[data-delete]');
      const cv = e.target.closest('[data-open-convo]');
      const dn = e.target.closest('[data-del-notif]');
      if (ap) return setStatus(ap.dataset.approve, 'Faol');
      if (rj) return setStatus(rj.dataset.reject, 'Rad etilgan');
      if (dl) return removeProduct(dl.dataset.delete);
      if (cv) { chatSelectedUser = cv.dataset.openConvo; return renderChat(); }
      if (dn) return deleteNotification(dn.dataset.delNotif);

      // Chat filtri / muhim / arxiv
      const cfl = e.target.closest('[data-chat-filter]');
      if (cfl) { chatFilter = cfl.dataset.chatFilter; return renderChat(); }
      const cst = e.target.closest('[data-chat-starred-toggle]');
      if (cst) { chatStarredOnly = !chatStarredOnly; return renderChat(); }
      const cat = e.target.closest('[data-chat-archived-toggle]');
      if (cat) { chatShowArchived = !chatShowArchived; return renderChat(); }
      const scv = e.target.closest('[data-star-convo]');
      if (scv) { const id = scv.dataset.starConvo; if (chatStarred.has(id)) chatStarred.delete(id); else chatStarred.add(id); saveChatFlags('starred'); return renderChat(); }
      const acv = e.target.closest('[data-archive-convo]');
      if (acv) {
        const id = acv.dataset.archiveConvo;
        if (chatArchived.has(id)) chatArchived.delete(id); else chatArchived.add(id);
        saveChatFlags('archived');
        if (id === chatSelectedUser) chatSelectedUser = null;
        toast(chatArchived.has(id) ? 'Suhbat arxivlandi' : 'Arxivdan qaytarildi');
        return renderChat();
      }
    });

    // Formalar (delegatsiya orqali): chat javobi va sozlamalar
    $('#viewRoot').addEventListener('submit', (e) => {
      const chatForm = e.target.closest('#chatReplyForm');
      const settingsForm = e.target.closest('#settingsForm');
      const notifForm = e.target.closest('#notifForm');
      if (chatForm) {
        e.preventDefault();
        const input = chatForm.querySelector('#chatReplyInput');
        const val = input.value;
        input.value = '';
        sendReply(val);
      } else if (settingsForm) {
        e.preventDefault();
        saveSettings(settingsForm);
      } else if (notifForm) {
        e.preventDefault();
        sendNotification(notifForm);
      }
    });

    // Foydalanuvchi amallari (jadval + modal) — hujjat darajasida
    document.addEventListener('click', (e) => {
      const ud = e.target.closest('[data-user-detail]');
      if (ud) return userDetailModal(ud.dataset.userDetail);
      const ub = e.target.closest('[data-user-block]');
      if (ub) return blockUser(ub.dataset.userBlock, ub.dataset.block === '1');
      const udl = e.target.closest('[data-user-delete]');
      if (udl) return deleteUser(udl.dataset.userDelete);
      const mc = e.target.closest('[data-mclose]');
      if (mc) return closeModal();
    });

    document.querySelectorAll('.nav-link').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentView = btn.dataset.view;
        document.querySelectorAll('.nav-link').forEach((b) => b.classList.toggle('active', b === btn));
        closeSb();
        render();
      });
    });

    $('#refreshBtn').addEventListener('click', () => { toast('Yangilanmoqda...'); loadData(); });

    /* ---------------- Boshlash ---------------- */
    if (!sb) {
      $('#viewRoot').innerHTML = '<div class="glass rounded-2xl p-6 text-sm text-rose-300">Supabase ulanmagan — supabase-config.js tekshiring.</div>';
    } else {
      loadData();
    }
  })();
  </script>
</body>
</html>
